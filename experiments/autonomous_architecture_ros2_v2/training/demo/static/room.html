<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wojtek — talk to the dog</title>
<style>
  :root {
    --bg: #14161c; --panel: #1c1f27; --line: #2e323d; --ink: #e8e6df;
    --dim: #9aa0ad; --amber: #e8a33d; --cyan: #5fc4cf; --green: #5aa871;
    --rust: #c96f5e; --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); height: 100vh;
    display: flex; flex-direction: column; overflow: hidden;
    font: 14px/1.5 "Avenir Next", "Segoe UI", system-ui, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 14px; padding: 10px 18px;
    border-bottom: 1px solid var(--line); flex: 0 0 auto;
    /* wrap rather than push the reset button off a narrow window */
    flex-wrap: wrap; row-gap: 6px;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: 0.02em; }
  /* Model/endpoint labels are long and mono; keep them on one line and let
     them ellipsize rather than wrapping the header into five rows. */
  header .model {
    font-family: var(--mono); font-size: 11px; color: var(--dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 34ch; flex: 0 1 auto;
  }
  header .model.bad { color: var(--rust); }
  /* On a narrow window the endpoint/model labels are the first thing to go:
     they are debug detail, while the chip, scene picker and reset are not. */
  @media (max-width: 900px) {
    header #agent, header #model, header #exec { display: none; }
  }
  .chip {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em;
    text-transform: uppercase; padding: 3px 10px; border-radius: 20px;
    border: 1px solid var(--line); color: var(--dim); transition: all 0.2s;
  }
  .chip.listening { color: #fff; background: var(--rust); border-color: var(--rust); animation: pulse 1.2s infinite; }
  .chip.thinking { color: #14161c; background: var(--amber); border-color: var(--amber); }
  .chip.walking { color: #fff; background: var(--green); border-color: var(--green); }
  .chip.done { color: var(--green); border-color: var(--green); }
  .chip.error { color: var(--rust); border-color: var(--rust); }
  @keyframes pulse { 50% { opacity: 0.55; } }
  header .spacer { flex: 1; }
  button {
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 7px 14px; font: inherit; cursor: pointer;
  }
  button:hover { border-color: var(--dim); }

  main { flex: 1; display: grid; grid-template-columns: 1.5fr 1fr; gap: 10px; padding: 10px 14px; min-height: 0; }
  /* small windows: stack and let the page scroll instead of crushing the grid */
  @media (max-width: 900px), (max-height: 560px) {
    body { height: auto; overflow: auto; }
    main { grid-template-columns: 1fr; }
    .cam { min-height: 260px; }
    .think { min-height: 180px; }
    footer { flex-wrap: wrap; }
    #goalbox { flex: 1 1 100%; }
  }
  .col { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .cam { position: relative; background: #000; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex: 1; min-height: 0; }
  .cam img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .cam .tag {
    position: absolute; top: 8px; left: 10px; font-family: var(--mono);
    font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    color: rgba(240,240,235,0.85); background: rgba(10,11,14,0.55);
    padding: 2px 8px; border-radius: 4px;
  }
  .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; flex: 1; min-height: 0; }
  .duo .cam { flex: none; height: 100%; }

  /* thinking timeline */
  .think {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    flex: 1; min-height: 0; display: flex; flex-direction: column;
  }
  .think h2 {
    margin: 0; padding: 8px 12px; font-size: 11px; font-family: var(--mono);
    letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim);
    border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center;
  }
  .think h2 button { padding: 1px 8px; font-size: 10px; }
  #decfilter.on { color: var(--amber); border-color: var(--amber); }

  /* decision feed: one row per agent event, source colour-coded */
  .dec { font-family: var(--mono); font-size: 11px; line-height: 1.45; display: flex; gap: 6px; }
  .dec .t { color: #6b7280; flex: 0 0 auto; }
  .dec .k { flex: 0 0 auto; font-weight: 600; }
  .dec .b { color: var(--ink); word-break: break-word; }
  .dec.chat  .k { color: var(--cyan); }
  .dec.nav   .k { color: var(--green); }
  .dec.search .k { color: var(--amber); }
  .dec.goal  .k { color: var(--rust); }
  .dec.session .k { color: var(--dim); }
  .dec .dim { color: var(--dim); }
  #timeline { overflow-y: auto; padding: 8px 12px; flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .step { font-size: 12.5px; line-height: 1.45; }
  .step .act {
    font-family: var(--mono); font-size: 11px; color: var(--amber);
    background: rgba(232,163,61,0.12); padding: 1px 7px; border-radius: 4px; margin-right: 6px;
  }
  .step .why { color: var(--dim); }
  .step .res { font-family: var(--mono); font-size: 10.5px; margin-left: 6px; }
  .step .res.ok { color: var(--green); }
  .step .res.bad { color: var(--rust); }
  .step.now .why { color: var(--ink); }

  /* chat with the dog */
  .chat {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    flex: 1; min-height: 0; display: flex; flex-direction: column;
  }
  .chat h2 {
    margin: 0; padding: 8px 12px; font-size: 11px; font-family: var(--mono);
    letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim);
    border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center;
  }
  .chat h2 button { padding: 1px 8px; font-size: 10px; }
  #chatlog { overflow-y: auto; padding: 8px 12px; flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .msg { font-size: 12.5px; line-height: 1.45; max-width: 92%; }
  .msg.user { align-self: flex-end; color: var(--cyan); }
  .msg.dog { align-self: flex-start; }
  .msg.sys { align-self: center; color: var(--dim); font-family: var(--mono); font-size: 10.5px; }
  .msg .toolcall {
    display: block; font-family: var(--mono); font-size: 10.5px; color: var(--amber);
  }
  #chatrow { display: flex; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--line); }
  #chatmsg { flex: 1; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; color: var(--ink); padding: 7px 10px; font: inherit; }

  /* debug traces: hidden until the "debug" toggle flips body.showdbg */
  .dbg { display: none; margin-top: 4px; }
  body.showdbg .dbg { display: block; }
  .dbg summary {
    cursor: pointer; font-family: var(--mono); font-size: 10px;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim);
  }
  .dbg pre {
    margin: 4px 0 0; padding: 6px 8px; background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px;
    font-family: var(--mono); font-size: 10.5px; line-height: 1.5;
    color: var(--dim); white-space: pre-wrap; word-break: break-word;
    max-height: 220px; overflow-y: auto;
  }
  .dbg pre .in { color: var(--cyan); }
  .dbg pre .out { color: var(--ink); }
  .dbg pre .tool { color: var(--amber); }
  #chatreset.on, #chatdbg.on { color: var(--amber); border-color: var(--amber); }
  /* the trace link rides with the debug toggle rather than a .dbg block */
  .dbg-inline { display: none; color: var(--cyan); text-decoration: none; margin-right: 10px; }
  body.showdbg .dbg-inline { display: inline; }
  #goaldbg { padding: 0 12px 6px; }

  footer {
    flex: 0 0 auto; display: flex; gap: 12px; align-items: center;
    padding: 12px 18px; border-top: 1px solid var(--line);
  }
  #mic {
    width: 54px; height: 54px; border-radius: 50%; font-size: 22px; flex: 0 0 auto;
    border: 2px solid var(--line); background: var(--panel);
  }
  #mic.rec { background: var(--rust); border-color: var(--rust); animation: pulse 1.2s infinite; }
  /* live voice mode: mic stays open, speech is detected server-side */
  #mic.live { background: var(--green); border-color: var(--green); }
  #mic.live.hearing { animation: pulse 0.8s infinite; }
  .vmeter {
    height: 4px; border-radius: 2px; background: var(--line); overflow: hidden;
    margin-top: 6px;
  }
  .vmeter i { display: block; height: 100%; width: 0%; background: var(--green); transition: width 0.1s; }
  #speaking { color: var(--amber); }
  .heard { flex: 1; min-width: 0; }
  .heard .label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
  #transcript { font-size: 16px; min-height: 22px; }
  #transcript .q { color: var(--cyan); }
  #goalbox { display: flex; gap: 8px; flex: 0 0 340px; }
  #goal { flex: 1; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; color: var(--ink); padding: 8px 10px; font: inherit; }
  #cancel { color: var(--rust); }
</style>
</head>
<body>
<header>
  <h1>Wojtek</h1>
  <span id="status" class="chip">connecting</span>
  <span class="model" id="model"></span>
  <select id="scene" title="scanned scene" style="background:#222;color:#ddd;border:1px solid #444;border-radius:6px;padding:2px 6px"></select>
  <span class="model" id="agent"></span>
  <span class="spacer"></span>
  <span class="model" id="exec"></span>
  <button id="reset">Reset robot</button>
</header>
<main>
  <div class="col">
    <div class="cam"><img id="chase" alt="chase camera"><span class="tag">chase cam — live physics</span></div>
  </div>
  <div class="col">
    <div class="duo">
      <div class="cam"><img id="ego" alt="ego camera"><span class="tag">what the dog sees (VLM input)</span></div>
      <div class="cam"><img id="map" alt="agent map" style="cursor: crosshair"><span class="tag">self-built map — click to walk</span></div>
    </div>
    <div class="think">
      <h2>Agent decisions
        <span>
          <button id="decfilter" title="show every event, including per-frame observations">all</button>
          <button id="decclear" title="clear the feed">clear</button>
        </span>
      </h2>
      <div id="timeline"></div>
    </div>
    <div class="chat">
      <h2>Chat with Wojtek
        <span>
          <a id="tracelink" class="dbg-inline" href="/api/trace?limit=500" target="_blank"
             title="full session trace (also on disk as JSONL)">trace ↗</a>
          <button id="chatdbg" title="show raw model I/O, tool calls, state machine">debug</button>
          <button id="overlaybtn" title="show the planner's collision cylinders on the chase cam">cylinders</button>
          <button id="chatreset" title="forget the conversation">forget</button>
        </span>
      </h2>
      <div id="chatlog"><div class="msg sys">say hi, ask what he sees, or send him to find something</div></div>
      <details id="goaldbg" class="dbg"><summary>goal state machine</summary><pre id="goaldbgpre">no goal yet</pre></details>
      <div id="chatrow">
        <input id="chatmsg" placeholder='"how are you?" · "what do you see?" · "find the ball"'>
        <button id="chatsend">Send</button>
      </div>
    </div>
  </div>
</main>
<footer>
  <button id="mic" title="live voice — click to start talking to Wojtek">🎙️</button>
  <div class="heard">
    <div class="label">the dog hears <span id="speaking"></span></div>
    <div id="transcript"><span class="q">click the mic and talk — he answers out loud</span></div>
    <div class="vmeter"><i id="vlevel"></i></div>
  </div>
  <div id="goalbox">
    <input id="goal" placeholder='or type: "go to the bed"'>
    <button id="send">Go</button>
    <button id="cancel">Stop</button>
  </div>
</footer>

<script>
const $ = id => document.getElementById(id);
let ws, info = null, lastState = "idle", stepSeen = 0;

// ---- websocket ------------------------------------------------------------
let superseded = false;
function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.binaryType = "arraybuffer";
  ws.onmessage = e => {
    // Binary frames are Wojtek's voice; everything else is JSON state.
    if (e.data instanceof ArrayBuffer) { playPcm(e.data); return; }
    const m = JSON.parse(e.data);
    if (m.type === "state") {
      if (m.frame) $("chase").src = "data:image/jpeg;base64," + m.frame;
      if (m.ego) $("ego").src = "data:image/jpeg;base64," + m.ego;
      if (m.map) $("map").src = "data:image/jpeg;base64," + m.map;
      $("exec").textContent = m.mode === "idle" ? "" :
        `${m.mode}${m.exec && m.exec.active ? " · " + m.exec.active + " (" + m.exec.remaining + " left)" : ""}`;
      if (lastState !== "listening" && lastState !== "thinking")
        setChip(m.mode === "idle" ? lastVlmChip() : "walking");
    } else if (m.type === "vlm_status") {
      renderVlm(m);
    } else if (m.type === "chat_reply") {
      renderChatReply(m);
    } else if (m.type === "trace") {
      addDecision(m);
    } else if (m.type === "heard") {
      // What the recogniser made of the last utterance -- shown before the
      // answer, so a mis-hearing is visible rather than mysterious.
      $("transcript").innerHTML = `<span class="q">&ldquo;${esc(m.text)}&rdquo;</span>`;
      addMsg("user", esc(m.text) + ` <span class="toolcall">🎙️ ${m.seconds}s</span>`);
      $("mic").classList.remove("hearing");
      setChip("thinking", "thinking…");
    } else if (m.type === "voice_state") {
      voiceOn = m.on;
      $("mic").classList.toggle("live", m.on);
      if (!m.on) stopPlayback();
    } else if (m.type === "barge_in") {
      stopPlayback();
    } else if (m.type === "agent_status") {
      renderAgentStatus(m);
    } else if (m.type === "goal_ack" && !m.ok) {
      setChip("error", "error: " + m.error);
      addStep({cmd: "goal rejected", result: m.error}, true);
    } else if (m.type === "error") {
      if (/took over|another client/.test(m.error)) superseded = true;
      setChip("error", m.error);
    }
  };
  ws.onclose = () => {
    // A tab that lost the sim to a newer viewer must NOT auto-retry: two
    // open tabs would kick each other every 1.5 s forever, both flashing
    // "disconnected". The loser parks until the user deliberately reloads.
    if (superseded) { setChip("error", "viewing in another tab — reload to take over"); return; }
    setChip("error", "disconnected — retrying"); setTimeout(connect, 1500);
  };
  ws.onopen = () => { superseded = false; setChip("idle"); };
}
fetch("/api/info").then(r => r.json()).then(j => {
  info = j;
  const sel = $("scene");
  (j.scenes || []).forEach(n => {
    const o = document.createElement("option");
    o.value = n; o.textContent = n; if (n === j.scene) o.selected = true;
    sel.appendChild(o);
  });
  sel.onchange = () => {
    setChip("error", "switching scene…");
    fetch("/api/scene", {method: "POST", headers: {"Content-Type": "application/json"},
                         body: JSON.stringify({name: sel.value})})
      .then(r => r.json())
      .then(a => a.ok ? location.reload() : setChip("error", a.error));
  };
  const label = j.vlm_backend === "futurenav"
    ? "FutureNav-4B @ " + (j.vlm_url || "action server")
    : j.vlm_backend === "anthropic"
      ? (j.vlm_model || "Claude")
      : j.vlm_backend === "openai"
        ? "nav: " + (j.vlm_model || j.agent_model || "").split("/").pop()
        : "on-device " + (j.vlm_model || "Qwen3-VL-30B (mlx)");
  $("model").textContent = label;
  // Which brain the chat agent talks to, and whether it is actually up.
  const short = (j.agent_model || "").split("/").pop();
  const agentLabel = "agent: " + short + " @ " + (j.agent_url || "?");
  $("agent").textContent = agentLabel;
  // Poll, don't check once: the endpoint lives on another machine and can
  // drop off (box asleep, VPN/tailnet switched) mid-session. A red header
  // beats waiting on a reply that will never come.
  if (j.agent_url) {
    const health = () => fetch("/api/agent_health").then(r => r.json()).then(h => {
      $("agent").classList.toggle("bad", !h.ok);
      $("agent").textContent = agentLabel + (h.ok ? "" : " — UNREACHABLE");
    }).catch(() => {});
    health();
    setInterval(health, 15000);
  }
});
connect();

// ---- status chip ------------------------------------------------------------
let vlmState = "idle";
function lastVlmChip() { return vlmState === "thinking" ? "thinking" : (vlmState === "done" ? "done" : "idle"); }
function setChip(kind, text) {
  const c = $("status");
  c.className = "chip " + kind;
  c.textContent = text || kind;
}

// ---- agent decision feed ----------------------------------------------------
// Everything the agent does arrives here as trace events: model output, tool
// calls with arguments and results, search FSM transitions, and the raw
// action FutureNav emitted before it was translated into a mid-level command.
let decVerbose = false;
const DEC_MAX = 400;

function decLine(e) {
  const family = (e.kind || "").split(".")[0];
  const t = (e.t ?? 0).toFixed(1) + "s";
  let body = "", label = e.kind;

  if (e.kind === "chat.ask")       body = `“${e.text}”`;
  else if (e.kind === "chat.llm")  { label = "chat.model"; body = `${esc(e.raw || "")}` +
      dim(` [${e.latency_ms ?? "?"} ms${e.tokens ? ", " + e.tokens + " tok" : ""}]`); }
  else if (e.kind === "chat.tool") body = `${e.tool}(${esc(JSON.stringify(e.args || {}))})` +
      dim(` → ${esc(String(e.result || "").slice(0, 110))}`);
  else if (e.kind === "chat.say")  body = `“${esc(e.say || "")}”`;
  else if (e.kind === "nav.state") {
    const l = e.last || {}, m = e.model || {};
    // FutureNav emits a discrete action; show it BEFORE the translation.
    // esc() the values, never the markup dim() adds around them.
    const model = m.action
      ? esc(m.action) + (m.timings ? dim(` [${esc(JSON.stringify(m.timings))}]`) : "")
      : "";
    body = `${e.state} step ${e.step ?? "-"}` +
      (model ? ` · model: ${model}` : "") +
      (l.action ? ` · cmd: ${l.action} ${l.amount ?? ""}` : "") +
      (e.reason ? dim(` · ${e.reason}`) : "") +
      (l.reasoning ? dim(` · ${esc(String(l.reasoning).slice(0, 90))}`) : "");
  }
  else if (family === "search")    body = esc(e.text || "");
  else if (family === "goal")      body = `${e.goal_kind || ""} “${esc(e.goal || "")}”` +
      (e.reason ? dim(` (${e.reason})`) : "");
  else                             body = esc(JSON.stringify(e).slice(0, 160));

  return `<div class="dec ${family}"><span class="t">${t}</span>` +
         `<span class="k">${label}</span><span class="b">${body}</span></div>`;
}
const dim = s => `<span class="dim">${s}</span>`;

// Per-frame observations are the bulk of a search and drown everything else,
// so they are hidden unless "all" is on.
function decNoisy(e) {
  return e.kind && e.kind.startsWith("search.") && /^obs #/.test(e.text || "");
}

function addDecision(e) {
  if (!decVerbose && decNoisy(e)) return;
  const box = $("timeline");
  box.insertAdjacentHTML("beforeend", decLine(e));
  while (box.childElementCount > DEC_MAX) box.removeChild(box.firstElementChild);
  box.scrollTop = box.scrollHeight;
}

$("decfilter").onclick = () => {
  decVerbose = !decVerbose;
  $("decfilter").classList.toggle("on", decVerbose);
  $("decfilter").textContent = decVerbose ? "all ✓" : "all";
};
$("decclear").onclick = () => { $("timeline").innerHTML = ""; };

// ---- thinking timeline ------------------------------------------------------
function addStep(h, bad) {
  const el = document.createElement("div");
  el.className = "step now";
  const m = /^([a-z_]+ ?[\d.]*)\s*(?:\((.*)\))?$/.exec(h.cmd) || [null, h.cmd, ""];
  const ok = /completed/.test(h.result);
  el.innerHTML = `<span class="act">${m[1] || h.cmd}</span>` +
    (m[2] ? `<span class="why">${m[2]}</span>` : "") +
    `<span class="res ${ok && !bad ? "ok" : "bad"}">${h.result}</span>`;
  document.querySelectorAll(".step.now").forEach(s => s.classList.remove("now"));
  $("timeline").appendChild(el);
  $("timeline").scrollTop = $("timeline").scrollHeight;
}
function renderVlm(m) {
  vlmState = m.state;
  // max_steps null = no budget (interactive default); show the step alone
  // rather than "step 7/null".
  if (m.state === "thinking")
    setChip("thinking", `thinking — step ${m.step}${m.max_steps ? "/" + m.max_steps : ""}`);
  else if (m.state === "executing") setChip("walking", "walking");
  else if (m.state === "done") setChip("done", "done — " + (m.reason || ""));
  else if (m.state === "error") setChip("error", "error: " + (m.error || ""));
  const hist = m.history || [];
  while (stepSeen < hist.length) addStep(hist[stepSeen++], false);
  // live "reasoning" of the CURRENT step before it lands in history
  if (m.last && m.state === "executing") {
    const now = document.querySelector(".step.now .why");
    if (!now || now.textContent !== m.last.reasoning) { /* shown when history lands */ }
  }
}

// ---- chat with the dog ------------------------------------------------------
let chatPending = null, lastAgentLine = "";
function addMsg(cls, html) {
  const el = document.createElement("div");
  el.className = "msg " + cls;
  el.innerHTML = html;
  $("chatlog").appendChild(el);
  $("chatlog").scrollTop = $("chatlog").scrollHeight;
  return el;
}
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
let chatTimer = null;
function sendChat() {
  const text = $("chatmsg").value.trim();
  if (!text) return;
  if (!ws || ws.readyState !== 1) { addMsg("sys", "not connected — reload the page"); return; }
  addMsg("user", esc(text));
  $("chatmsg").value = "";
  chatPending = addMsg("sys", "Wojtek is thinking…");
  // Tick the wait: a silent spinner is indistinguishable from a dead backend,
  // which is exactly how an unreachable agent endpoint used to present.
  const t0 = Date.now();
  clearInterval(chatTimer);
  chatTimer = setInterval(() => {
    if (!chatPending) { clearInterval(chatTimer); return; }
    const s = Math.round((Date.now() - t0) / 1000);
    chatPending.textContent = `Wojtek is thinking… ${s}s`
      + (s >= 20 ? " (slow — check the agent endpoint in the header)" : "");
  }, 1000);
  ws.send(JSON.stringify({type: "chat", text}));
}
function chatDebugHtml(dbg) {
  // Full turn trace: every LLM call's raw output, how it was classified,
  // the tool call + (truncated) result, latency/token metadata.
  const calls = dbg && dbg.llm_calls || [];
  if (!calls.length) return "";
  const lines = [];
  calls.forEach((c, i) => {
    const meta = [c.kind || "?",
                  c.latency_ms != null ? c.latency_ms + " ms" : null,
                  c.tokens != null ? c.tokens + " tok" : null].filter(Boolean).join(" · ");
    lines.push(`<span class="in">── llm call ${i + 1}/${calls.length} [${esc(meta)}]</span>`);
    lines.push(`<span class="out">&lt;&lt; ${esc(c.raw)}</span>`);
    if (c.tool) lines.push(`<span class="tool">→ ${esc(c.tool)} ${esc(JSON.stringify(c.args || {}))}</span>`);
    if (c.tool_result != null)
      lines.push(`<span class="tool">← ${esc(c.tool_result)}${c.tool_images ? ` [+${c.tool_images} image]` : ""}</span>`);
  });
  if (dbg.history_len != null) lines.push(`<span class="in">history: ${dbg.history_len} messages kept</span>`);
  return `<details class="dbg"><summary>debug · ${calls.length} llm call${calls.length > 1 ? "s" : ""}</summary><pre>${lines.join("\n")}</pre></details>`;
}
function renderChatReply(m) {
  clearInterval(chatTimer);
  if (chatPending) { chatPending.remove(); chatPending = null; }
  if (!m.ok) { addMsg("sys", "chat error: " + esc(m.error || "unknown")); return; }
  const tools = (m.steps || [])
    .map(s => `<span class="toolcall">🔧 ${esc(s.tool)} ${esc(JSON.stringify(s.args))}</span>`)
    .join("");
  addMsg("dog", tools + "🐕 " + esc(m.say) + chatDebugHtml(m.debug));
}
function renderAgentStatus(m) {
  // One dim line per goal-state change (searching / found / not_found …)...
  if (!m.goal) return;
  const note = m.detail && m.detail.note ? " — " + m.detail.note : "";
  const line = `${m.kind} "${m.goal}": ${m.state}${note}`;
  if (line !== lastAgentLine) {
    lastAgentLine = line;
    addMsg("sys", esc(line));
  }
  // ...plus the always-current state-machine panel: full status + event log
  // (commands, observations with scores, frontier selections, verify votes).
  const d = m.detail || {};
  const head = [`goal:  ${m.kind} "${m.goal}"`, `state: ${m.state}${note}`];
  if (d.observations != null)
    head.push(`obs: ${d.observations}   blacklisted: ${d.blacklisted || 0}   attempted: ${d.attempted || 0}`
              + (d.found_xy ? `   found at (${d.found_xy.map(v => v.toFixed(2)).join(", ")})` : ""));
  if (d.step != null)
    head.push(`step: ${d.step}${d.max_steps ? "/" + d.max_steps : " (no cap)"}`
              + (d.reason ? `   reason: ${d.reason}` : ""));
  if (d.last) head.push(`last: ${d.last.action} ${d.last.amount ?? ""} — ${d.last.reasoning || ""}`);
  let body = "";
  if (d.events && d.events.length)
    body = "\n" + d.events.map(e => `[${e.state}] ${e.text}`).join("\n");
  else if (d.history && d.history.length)
    body = "\n" + d.history.map(h => `${h.cmd} -> ${h.result}`).join("\n");
  const pre = $("goaldbgpre");
  pre.innerHTML = esc(head.join("\n") + body);
  pre.scrollTop = pre.scrollHeight;
}
$("chatsend").onclick = sendChat;
$("chatmsg").addEventListener("keydown", e => { if (e.key === "Enter") sendChat(); });
$("chatreset").onclick = () => {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({type: "chat_reset"}));
  $("chatlog").innerHTML = '<div class="msg sys">conversation forgotten</div>';
};
$("chatdbg").onclick = () => {
  const on = document.body.classList.toggle("showdbg");
  $("chatdbg").classList.toggle("on", on);
  if (on) $("goaldbg").open = true;
};
// Planner footprint cylinders: debug aid, OFF by default (server-side too).
let overlayOn = false;
$("overlaybtn").onclick = () => {
  overlayOn = !overlayOn;
  $("overlaybtn").classList.toggle("on", overlayOn);
  ws.send(JSON.stringify({type: "overlay", on: overlayOn}));
};

// ---- goal submission -------------------------------------------------------
function sendGoal(text) {
  if (!text.trim()) return;
  stepSeen = 0;
  $("timeline").innerHTML = "";
  ws.send(JSON.stringify({type: "goal", text: text.trim()}));
}
$("send").onclick = () => sendGoal($("goal").value);
$("goal").addEventListener("keydown", e => { if (e.key === "Enter") sendGoal($("goal").value); });
$("cancel").onclick = () => ws.send(JSON.stringify({type: "goal_cancel"}));
$("reset").onclick = () => ws.send(JSON.stringify({type: "reset"}));

// ---- live voice: streaming mic in, streamed speech out ----------------------
// The mic stays open and the SERVER decides where an utterance ends (energy +
// silence timeout), so there is no push-to-talk button to hold. Capture is a
// worklet rather than MediaRecorder: we need raw PCM frames as they happen,
// not a webm blob at the end of a recording.
const RATE = 24000;                       // matches wojtek_rl.agent.voice
const WORKLET_SRC = `
class PCMTap extends AudioWorkletProcessor {
  process(inputs) {
    const ch = inputs[0][0];
    if (ch) this.port.postMessage(ch.slice(0));
    return true;
  }
}
registerProcessor("pcm-tap", PCMTap);`;

let micStream = null, micCtx = null, micNode = null, voiceOn = false;

async function startVoice() {
  micStream = await navigator.mediaDevices.getUserMedia({
    // echoCancellation matters here: the dog's own voice comes out of the
    // same laptop speakers the mic is listening to, and without it every
    // reply would barge in on itself.
    audio: {channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true},
  });
  micCtx = new AudioContext({sampleRate: RATE});
  await micCtx.audioWorklet.addModule(
    URL.createObjectURL(new Blob([WORKLET_SRC], {type: "application/javascript"})));
  const src = micCtx.createMediaStreamSource(micStream);
  micNode = new AudioWorkletNode(micCtx, "pcm-tap");
  let buf = [], len = 0;
  const target = Math.round(micCtx.sampleRate / 10);   // 100 ms frames
  micNode.port.onmessage = ev => {
    buf.push(ev.data); len += ev.data.length;
    if (len < target) return;
    const all = new Float32Array(len); let o = 0;
    buf.forEach(a => { all.set(a, o); o += a.length; });
    buf = []; len = 0;
    let peak = 0;
    const pcm = new Int16Array(all.length);
    for (let i = 0; i < all.length; i++) {
      const v = all[i];
      if (Math.abs(v) > peak) peak = Math.abs(v);
      pcm[i] = Math.max(-32768, Math.min(32767, Math.round(v * 32767)));
    }
    $("vlevel").style.width = Math.min(100, peak * 180).toFixed(0) + "%";
    if (ws && ws.readyState === 1 && voiceOn) ws.send(pcm.buffer);
  };
  src.connect(micNode);
}

function stopVoice() {
  if (micNode) { micNode.disconnect(); micNode = null; }
  if (micCtx) { micCtx.close(); micCtx = null; }
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  $("vlevel").style.width = "0%";
}

$("mic").onclick = async () => {
  if (voiceOn) {
    voiceOn = false;
    stopVoice();
    ws.send(JSON.stringify({type: "voice", on: false}));
    $("mic").classList.remove("live", "hearing");
    setChip("idle");
    return;
  }
  try {
    await startVoice();
    voiceOn = true;
    ws.send(JSON.stringify({type: "voice", on: true}));
    $("mic").classList.add("live");
    setChip("listening", "listening…");
  } catch (err) { setChip("error", "mic: " + err.message); }
};

// ---- playback: queue PCM frames as they stream in ---------------------------
// Frames are scheduled back-to-back on the audio clock rather than played on
// arrival, so network jitter does not turn into audible gaps.
let outCtx = null, playHead = 0;
function playPcm(buffer) {
  if (!outCtx) outCtx = new AudioContext({sampleRate: RATE});
  const pcm = new Int16Array(buffer);
  if (!pcm.length) return;
  const audio = outCtx.createBuffer(1, pcm.length, RATE);
  const ch = audio.getChannelData(0);
  for (let i = 0; i < pcm.length; i++) ch[i] = pcm[i] / 32768;
  const node = outCtx.createBufferSource();
  node.buffer = audio;
  node.connect(outCtx.destination);
  const now = outCtx.currentTime;
  if (playHead < now) playHead = now + 0.02;   // small cushion after a gap
  node.start(playHead);
  playHead += audio.duration;
  $("speaking").textContent = "· speaking";
  clearTimeout(playPcm._idle);
  playPcm._idle = setTimeout(() => { $("speaking").textContent = ""; },
                             (playHead - now) * 1000 + 250);
}
function stopPlayback() {
  // Dropping the context is the reliable way to kill everything already
  // scheduled; a new one is created on the next frame.
  if (outCtx) { outCtx.close(); outCtx = null; }
  playHead = 0;
  $("speaking").textContent = "";
}

// ---- click-to-walk on the agent map -----------------------------------------
$("map").onclick = e => {
  if (!info || !info.map_geom) return;
  const img = $("map");
  const g = info.map_geom, [H, W] = g.shape;
  const scale = Math.min(img.clientWidth / W, img.clientHeight / H) *
                (Math.max(H, W) / Math.max(img.naturalHeight, img.naturalWidth) *
                 Math.max(img.naturalHeight, img.naturalWidth) / Math.max(H, W));
  // object-fit: contain -> compute displayed image box
  const arImg = img.naturalWidth / img.naturalHeight;
  const arBox = img.clientWidth / img.clientHeight;
  let dw, dh, ox, oy;
  if (arImg > arBox) { dw = img.clientWidth; dh = dw / arImg; ox = 0; oy = (img.clientHeight - dh) / 2; }
  else { dh = img.clientHeight; dw = dh * arImg; oy = 0; ox = (img.clientWidth - dw) / 2; }
  const r = img.getBoundingClientRect();
  const u = (e.clientX - r.left - ox) / dw, v = (e.clientY - r.top - oy) / dh;
  if (u < 0 || u > 1 || v < 0 || v > 1) return;
  const x = g.origin[0] + u * W * g.res;
  const y = g.origin[1] + (1 - v) * H * g.res;
  ws.send(JSON.stringify({type: "target", x, y}));
};
