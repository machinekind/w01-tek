# @package _global_
# Single-GPU (RTX 3090, 24 GB) locomotion run: same task as `locomotion`,
# playground-tuned single-GPU PPO scale (8192 envs / batch 256 — the scale
# fbb_v2/v3 trained at on this card). The 4x scaling for the H100 node
# lives in jobs/train.sh, not in the preset.
# Usage: ./run.sh train +experiment=locomotion_3090
defaults:
  - locomotion

ppo:
  num_timesteps: 300000000

run_name: fbb_loco_3090_v1
