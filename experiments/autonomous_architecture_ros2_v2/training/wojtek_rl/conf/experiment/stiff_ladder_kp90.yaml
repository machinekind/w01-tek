# @package _global_
# Rung 5 of the stiffness ladder, an extension rung beyond the kp50-80
# ladder (kp40/kd1.6 keeper -> kp50/60/70/80 -> kp90/100). Restored from
# the kp50-80 ladder's winner, stiff_ladder_kp80's accepted checkpoint
# (wojtek_stiff_kp80_20260718_100225). kd=2.40 holds the keeper's damping
# ratio constant: kd = 1.6*sqrt(kp/40) = 1.6*sqrt(90/40). max_torque stays
# 9.0, unchanged from the keeper.
# Launched with restore=<kp80 rung's accepted checkpoint>; this preset
# does not set restore.
# Usage: ./training/run.sh train +experiment=stiff_ladder_kp90 restore=runs/wojtek_stiff_kp80_20260718_100225/checkpoints/<step>
defaults:
  - springy_phase_b

task:
  env:
    pd_kp: 90.0
    pd_kd: 2.40
    max_torque: 9.0

dr:
  joint_gains: { enable: true, gain_pct: 0.2, kd_pct: 0.2 }

ppo:
  num_timesteps: 400000000

run_name: wojtek_stiff_kp90
