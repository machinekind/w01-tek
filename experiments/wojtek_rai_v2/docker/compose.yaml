# The RAI container, run next to wojtek_robot (ros/docker/compose.yaml).
# Same host network, same ROS_DOMAIN_ID and CycloneDDS profile, so the two
# discover each other exactly like two nodes on one host. Relative paths
# resolve against this file's directory.
#
# Credentials are NOT declared here. run.sh forwards OPENAI_API_KEY (and the
# other names it knows) by name at `docker exec` time, from the gitignored
# root .env; a value never lands in a compose file or on a command line.
name: wojtek_rai

services:
  wojtek_rai:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: wojtek_rai:jazzy
    container_name: wojtek_rai
    network_mode: host
    ipc: host
    working_dir: /exp
    volumes:
      # The experiment itself: code, config.toml, embodiment, tests.
      - ..:/exp
      # The simulation's own DDS profile, read-only, so it can never drift
      # from what wojtek_robot runs.
      - ../../../ros/docker/config/cyclonedds.xml:/config/cyclonedds.xml:ro
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=42
      - CYCLONEDDS_URI=file:///config/cyclonedds.xml
      # On hosts where CycloneDDS multicast loopback is broken (seen on the
      # aarch64 GPU dev box), export ROS_LOCALHOST_ONLY=1 for BOTH containers.
      - ROS_LOCALHOST_ONLY=${ROS_LOCALHOST_ONLY:-0}
      - PYTHONUNBUFFERED=1

  # Perception: RAI's GroundingDINO (/detection) and SAM2 (/segmentation)
  # services on the laptop GPU (nvidia container runtime required). Weights
  # persist in a named volume across container recreation.
  wojtek_perception:
    build:
      context: ..
      dockerfile: docker/perception.Dockerfile
      # The perception Dockerfile starts FROM the agent image. Declaring it
      # as a service context is what makes Compose build wojtek_rai first
      # (depends_on does not order builds), so `perception build` works on
      # a fresh machine.
      additional_contexts:
        wojtek_rai: service:wojtek_rai
    image: wojtek_perception:jazzy
    container_name: wojtek_perception
    network_mode: host
    ipc: host
    runtime: nvidia
    working_dir: /exp
    volumes:
      - ..:/exp
      - ../../../ros/docker/config/cyclonedds.xml:/config/cyclonedds.xml:ro
      - wojtek_rai_weights:/root/.cache
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=42
      - CYCLONEDDS_URI=file:///config/cyclonedds.xml
      - ROS_LOCALHOST_ONLY=${ROS_LOCALHOST_ONLY:-0}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - ENABLE_LEGACY_SERVICE_NAMES=false
      - PYTHONUNBUFFERED=1
    # Detection only: SAM2 + GroundingDINO together overflow a 4 GB GPU that
    # also renders the simulation. See wojtek_rai/perception_services.py.
    command: ["python3", "-m", "wojtek_rai.perception_services"]

  # Navigation: Nav2 + slam_toolbox + depth->scan + the glue nodes in
  # wojtek_rai/nav. Same network/DDS settings as the agent container.
  wojtek_nav:
    build:
      context: ..
      dockerfile: docker/nav.Dockerfile
    image: wojtek_nav:jazzy
    container_name: wojtek_nav
    network_mode: host
    ipc: host
    working_dir: /exp
    volumes:
      - ..:/exp
      - ../../../ros/docker/config/cyclonedds.xml:/config/cyclonedds.xml:ro
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=42
      - CYCLONEDDS_URI=file:///config/cyclonedds.xml
      - ROS_LOCALHOST_ONLY=${ROS_LOCALHOST_ONLY:-0}
      - PYTHONUNBUFFERED=1

volumes:
  wojtek_rai_weights:
    name: wojtek_rai_weights
