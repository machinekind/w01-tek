# pointcloud_to_laserscan: the depth point cloud, expressed in base_link and
# sliced by height, as the planar /scan. base_link sits ~0.13 m above the
# floor when standing, so the floor is at z ~ -0.13; min_height -0.05 keeps
# everything taller than ~8 cm and drops the floor the 15-deg-down camera
# always sees (depthimage_to_laserscan's centre rows hit it at 0.8 m, which
# read as a permanent wall).
#
# The slice is only as good as base_link->camera_link. It is tuned for the
# URDF mount the sim publishes (camera at (0.32, 0, 0.07), pitched 15 deg
# down; see ros/src/wojtek_pc/wojtek_pc/camera_spec.py). The real bringup
# does not use the URDF camera: it publishes the static transform from
# ros/src/wojtek_perception_bringup/config/extrinsics.yaml, which ships as
# an all-zero placeholder (xyz 0, pitch 0). With a level camera at the body
# origin, floor points 1-3 m ahead land at z ~ +0.07 minus a few cm, inside
# [min_height, max_height], and every scan reports a solid arc at ~0.5-3 m:
# both costmaps fill in front of the robot and plans fail with no hint why.
# Measure the D435 mount and fill extrinsics.yaml before trusting /scan on
# the real robot, then re-derive min_height/max_height (or override them at
# launch) for the measured mount.
pointcloud_to_laserscan:
  ros__parameters:
    target_frame: base_link
    transform_tolerance: 0.2
    min_height: -0.05
    max_height: 0.60
    # The D435 sees ~87 deg horizontally. Beam count must satisfy both
    # pointcloud_to_laserscan (ceil(span/inc) beams) and slam_toolbox/karto
    # (span/inc + 1 beams): span = inc * 200 + epsilon gives 201 for both.
    angle_min: -0.80
    angle_max: 0.8001
    angle_increment: 0.008
    scan_time: 0.0667
    range_min: 0.25
    range_max: 4.0
    use_inf: true
    inf_epsilon: 1.0
    queue_size: 4
