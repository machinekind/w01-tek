# Named places the agent can navigate to, in the map frame. The sim map's
# origin is where the robot booted (0, 0, yaw 0), so these are the prop
# positions from ros/src/wojtek_pc/config/scene_sim.xml pulled back by
# `standoff` metres towards the origin, i.e. "in front of" the object.
# Facing (yaw) points at the object.
frame: map
standoff: 0.6
places:
  ball:          {x: 1.60, y:  0.58}
  hydrant:       {x: 2.10, y: -1.30}
  traffic_light: {x: 0.90, y: -3.10}
  stop_sign:     {x: 1.72, y:  2.46}
  clock:         {x: -2.35, y: 0.86}
  person:        {x: 6.48, y:  0.57}
  home:          {x: 0.0,  y:  0.0, standoff: 0.0, yaw: 0.0}
