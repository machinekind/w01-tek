# slam_toolbox (async, online mapping) fed by the depth-derived /scan.
# The scan is narrow (~87 deg) and short (4 m): scan matching gets little
# structure, so odometry carries most of the pose and the map is built from
# what the camera has actually looked at. Publishes map->odom.
slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: mapping
    use_map_saver: true

    debug_logging: false
    throttle_scans: 1
    # 0 = slam_toolbox publishes no map->odom. In the sim the launch file
    # pins map->odom to identity with a static publisher instead (scan
    # matching is off anyway, and slam's own TF was observed to vanish
    # after a few minutes at rest). Set >0 again when matching is on.
    transform_publish_period: 0.0
    map_update_interval: 1.0
    resolution: 0.05
    min_laser_range: 0.25
    max_laser_range: 4.0
    minimum_time_interval: 0.2
    transform_timeout: 0.5
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: false

    # Scan matching OFF. The depth-derived scan is narrow (87 deg), short
    # (4 m) and mostly empty floor between a few props; matching it produced
    # a bogus map->odom (metres, ~180 deg) within one minute. Odometry is
    # ground truth in the sim, so the map is simply accumulated on it and
    # map->odom stays identity. Revisit for the real robot (visual odometry
    # drifts; then the map itself must correct it).
    use_scan_matching: false
    use_scan_barycenter: true
    minimum_travel_distance: 0.10
    minimum_travel_heading: 0.15
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 4.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: false
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
