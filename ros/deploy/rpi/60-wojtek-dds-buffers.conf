# UDP socket buffers for CycloneDDS, installed by deploy/rpi/install.sh.
#
# The kernel's 208 KB default is below what Cyclone requests (~1 MB), so it
# is silently clamped. That only shows up with large samples: an 848x480
# rgb8 camera frame is 1.22 MB, fragmented into ~840 UDP datagrams, and DDS
# discards the entire frame if one fragment is dropped. The control loop's
# own topics (joint states, IMU, commands) are a few hundred bytes and were
# never affected by this.
#
# 8 MB covers several frames in flight on both directions of the link.
net.core.rmem_max = 8388608
net.core.wmem_max = 8388608
net.core.rmem_default = 8388608
net.core.wmem_default = 8388608
