# DHCP for clients associating to the RPi's wlan0 AP (mobile case).
# Install: sudo cp dnsmasq-wojtek.conf /etc/dnsmasq.d/wojtek.conf
#
# DHCP-only (port=0 disables the DNS server) so this never fights
# systemd-resolved on :53. bind-interfaces + interface=wlan0 keeps it strictly
# on the AP interface -- it must never touch eth0.
port=0
interface=wlan0
bind-interfaces
except-interface=eth0

# The RPi is always 10.42.0.2. Hand clients .10-.50; the PC (or a phone)
# picks up an address here when it associates to wojtek-link.
dhcp-range=10.42.0.10,10.42.0.50,255.255.255.0,12h
# Advertise NO default route (option 3 empty) and NO DNS (option 6 empty): the
# AP has no internet uplink, so a gateway/DNS via .2 would just be a dead route
# that clients might install. Without them, a client (e.g. the PC) keeps its
# own internet default (home cable/wifi) and still reaches the RPi on-link.
dhcp-option=3
dhcp-option=6
