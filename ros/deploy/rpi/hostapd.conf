# RPi-as-AP for the mobile (no-cable) case. hostapd owns wlan0.
# Install: sudo cp hostapd.conf /etc/hostapd/hostapd.conf
# The wojtek-net switch (see wojtek-net-switch.sh) starts/stops hostapd based
# on whether the ethernet cable is present -- do NOT `systemctl enable hostapd`
# directly, the switch manages it.
interface=wlan0
driver=nl80211

# SSID + band. 2.4 GHz / channel 1 for range and client compatibility
# (matches the old PC-side profile). country_code must match the wifi regdom
# (PL, set by netplan/crda) or hostapd refuses to start.
ssid=wojtek-link
country_code=PL
hw_mode=g
channel=1
ieee80211n=1
wmm_enabled=1

# WPA2-PSK. The passphrase is personal: install.sh substitutes the
# placeholder from WOJTEK_AP_PSK (deploy.sh passes it from .env; see
# .env.example). Clients that already know the old passphrase keep working
# as long as the same value is kept in .env.
auth_algs=1
wpa=2
wpa_passphrase=__WOJTEK_AP_PSK__
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP

# The RPi is the AP; clients (PC/phone) associate to it.
macaddr_acl=0
ignore_broadcast_ssid=0
