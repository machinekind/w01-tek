# The drop-in as found on the robot on 2026-10-23
# (/etc/systemd/system/wojtek-robot.service.d/10-local.conf), kept as the
# record of what the robot ran then: can_baud:=1, nav on without the
# costmap, perception off, max_torque:=6, the pre-profile policy symlink,
# PYTHONPATH for the deck's aiohttp. Nothing installs this file.
# install.sh renders ../wojtek-robot-local.conf (robot:= profile, keeper
# org) into that path on every provision. Differences from the base unit's
# ExecStart, as they were written on the robot:
#
#   * boot_pose:=folded control_cpus:=3 policy_cpus:=2 -- the robot starts lying folded (knees on the
#     mechanical stop); real_io computes encoder offsets at service start
#     assuming that pose. Pose the robot BEFORE starting/restarting the
#     service, or re-zero with /wojtek/zero afterwards.
#   * bag:=false -- the always-on rosbag (400 Hz introspection to the SD
#     card) starved the Pi 3's cores and broke the policy's freshness
#     watchdog. Record on demand instead.
#   * leg_odom:=false max_torque:=6 policy:=/home/rpi/policy -- a stable local reference instead of a
#     Hugging Face id: the robot needs no network and no HF_ORGANIZATION.
#     Deploying a policy is a config change done by hand (current default
#     on the robot: wojtek_flat_quiet_baseacc_s0):
#         rsync -a training/runs/wojtek_flat_quiet_baseacc_s0/deploy/ \
#             rpi@10.42.0.2:policies/wojtek_flat_quiet_baseacc_s0/
#         ssh rpi@10.42.0.2 'ln -sfn /home/rpi/policies/wojtek_flat_quiet_baseacc_s0 /home/rpi/policy'
#         ssh rpi@10.42.0.2 'sudo systemctl restart wojtek-robot.service'
[Service]
Environment=PYTHONPATH=/home/rpi/py_deps
ExecStart=
ExecStart=/usr/bin/taskset -c 2,3 /bin/bash -lc 'source /opt/ros/jazzy/setup.bash && source /home/rpi/wojtek_ws/install/setup.bash && exec ros2 launch wojtek_bringup robot.launch.py can_baud:=1 boot_pose:=folded control_cpus:=3 policy_cpus:=2 perception:=false nav:=true nav_costmap:=false max_torque:=6 policy:=/home/rpi/policy gamepad:=true gamepad_cpus:=0,1 bag:=false bag_cpus:=0,1 telemetry:=true foxglove:=true foxglove_cpus:=0,1'
