# Robot-local overrides for wojtek-robot.service, installed by install.sh
# (phase 5) as /etc/systemd/system/wojtek-robot.service.d/10-local.conf on
# every provision (the __PLACEHOLDERS__ are filled from the PC's .env).
# Differences from the base unit's ExecStart:
#
#   * robot:=__WOJTEK_ROBOT__ -- the robot profile (wojtek_policy/robots.py:
#     legs, joint map, poses, trick clips, pinned policy). WOJTEK_ROBOT in
#     the PC's .env, `wojtek` when unset. The launch does not read the
#     variable itself, so it is spelled out here.
#   * HF_ORGANIZATION -- the keeper org of the pinned policies. The pin in
#     the profile is `name@commit`; without the org it is an empty reference
#     and every launch would need an explicit policy:=. ./deploy.sh resolves
#     the pin into ~/wojtek_ws/policies, so the robot needs no network.
#     (Until 2026-10-23 this file carried policy:=/home/rpi/policy, a symlink
#     to a hand-copied deploy directory, instead.)
#   * boot_pose:=folded -- the robot starts lying in the profile's folded
#     pose (stock: knees on the mechanical stop; wojtek_v2: shins folded flat
#     on the floor, body on the four 35 mm standoffs, every lever on its
#     folding stop). real_io computes encoder offsets at service start
#     assuming that pose. Pose the robot BEFORE starting/restarting the
#     service, or re-zero with /wojtek/zero afterwards. A lever left off its
#     stop gives that leg a constant offset that looks like a wrong
#     direction at stand-up (seen 2026-10-23).
#   * bag:=false -- the always-on rosbag (400 Hz introspection to the SD
#     card) starved the Pi 3's cores and broke the policy's freshness
#     watchdog. Record on demand instead.
#   * max_torque:= is not set here: the policy contract's cap applies. For
#     the first runs of a new set of legs add e.g. max_torque:=12 by hand.
[Service]
Environment=HF_ORGANIZATION=__HF_ORGANIZATION__
ExecStart=
ExecStart=/usr/bin/taskset -c 2,3 /bin/bash -lc 'source /opt/ros/jazzy/setup.bash && source /home/rpi/wojtek_ws/install/setup.bash && exec ros2 launch wojtek_bringup robot.launch.py robot:=__WOJTEK_ROBOT__ boot_pose:=folded control_cpus:=3 policy_cpus:=2 gamepad:=true gamepad_cpus:=0,1 bag:=false bag_cpus:=0,1 deck:=true deck_cpus:=0,1 deck_camera:=true'
