x-common-config:
  &common-config
  network_mode: host
  ipc: host

services:
  wojtek_robot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: wojtek_robot
    <<: *common-config
    # Realtime hardware (https://control.ros.org/master/doc/ros2_control/controller_manager/doc/userdoc.html#determinism)
    privileged: true
    ulimits:
      rtprio:
        soft: 99
        hard: 99
      memlock:
        soft: 102400
        hard: 102400
    volumes:
      - ../src:/ros2_ws/src
      # The experimental agentic stack's ROS packages, kept out of ros/src so
      # that the robot workspace (deploy.sh rsyncs src/ only) can never ship
      # them. A second colcon base path, so sim.sh --build still builds them
      # for PC-side development. See experiments/*/README.md.
      - ../../experiments/autonomous_architecture_ros2_v1/ros/src:/ros2_ws/experimental_src
      # The policy store, the same ros/policies the host checkout uses. A
      # policy fetched in the container is fetched for the host too, and
      # deploy.sh rsyncs the same store to the RPi.
      - ../policies:/ros2_ws/policies
      # Per-run rosbags. This container is the PC dev environment, where
      # viz.launch.py bag:=true records the whole run (all RPi topics, over
      # DDS). The launch default bag_dir is ~/wojtek_bags == /root/wojtek_bags
      # in the container. A named volume (not a bind mount into the repo) so the
      # data lands on the /var/lib/docker partition, which has the space for it
      # -- bags were filling up the root partition. Survives container
      # recreation. From the host: /var/lib/docker/volumes/wojtek_bags/_data
      # (root-owned, needs sudo).
      - wojtek_bags:/root/wojtek_bags
      # Host SSH keys (read-only) so `ros2 run wojtek_bringup robot` can start
      # the RPi's control stack over SSH from inside the container. Mounted
      # to a staging path, not straight to /root/.ssh: it keeps the host
      # user's uid ownership, and root-in-container ssh refuses to read
      # config/keys it doesn't own ("Bad owner or permissions ..."). The
      # entrypoint copies it into a root-owned /root/.ssh at container start.
      - ${HOME}/.ssh:/host-ssh:ro
      # The host's Hugging Face cache carries the login token and the
      # download cache that fills the policy store. The keeper repos are
      # private, and the container reuses the host's login. Fetch a policy
      # with python3 -m wojtek_policy.policy_source <ref>.
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
      # Host SSH agent socket. The RPi key (id_ed25519) is passphrase-protected,
      # so mounting ~/.ssh alone is NOT enough: without the agent, ssh inside the
      # container can't decrypt the key and silently falls back to password auth
      # (the "asks for the host password every time" bug). Forwarding the agent
      # lets the container reuse the already-unlocked, already-RPi-authorized key.
      # dev.sh loads the key into the host agent before starting this. Falls back
      # to /dev/null when no agent is running (ssh just warns and moves on).
      - ${SSH_AUTH_SOCK:-/dev/null}:/ssh-agent
      - ./config/cyclonedds.xml:/config/cyclonedds.xml
      # Unicast fallback profile (see cyclonedds_link.xml + the CYCLONEDDS_URI
      # note under environment). Mounted so it can be switched on without a rebuild.
      - ./config/cyclonedds_link.xml:/config/cyclonedds_link.xml
      # Full /dev instead of a static snapshot: the IMU's CP2102 drops off
      # the bus under a flaky cable and re-enumerates (sometimes as a new
      # ttyUSBx). A privileged container's tmpfs /dev is frozen at container
      # start, so hotplugged nodes and the /dev/serial/by-id symlinks (which
      # the URDF uses as the IMU port) only stay correct with the host's
      # /dev mounted directly.
      - /dev:/dev
      # md80_hardware_interface's candle library identifies the CAN-USB
      # adapter via `udevadm info` (checks ID_VENDOR_ID/ID_USB_MODEL_ID),
      # not just by opening the device file. udevadm reads the udev
      # database in /run/udev, which is host-only state -- without this
      # mount candle always reports "No devices found!" even though
      # /dev/ttyACM0 itself is visible (privileged: true is not enough).
      - /run/udev:/run/udev:ro
      # GUI (RViz, sim.launch.py's rviz:=true default) needs the host's X
      # server - a genuine, unavoidable host-side exception, same category
      # as udev rules. ../dev.sh runs `xhost +local:docker` for you before
      # starting this container; without it RViz will fail to open a window.
      - /tmp/.X11-unix:/tmp/.X11-unix
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      # Must match the robot (RPi). Isolates our DDS traffic from any other
      # ROS 2 on the link. Set the same value on the RPi (systemd unit / bashrc).
      - ROS_DOMAIN_ID=42
      # Default profile auto-selects the interface (works for single-host and
      # usually over the PC hotspot's local bridge). If the RPi and PC don't
      # discover each other over wifi, switch this to the unicast fallback:
      #   CYCLONEDDS_URI=file:///config/cyclonedds_link.xml
      - CYCLONEDDS_URI=file:///config/cyclonedds.xml
      - DISPLAY=${DISPLAY}
      # Point ssh at the forwarded host agent socket (mounted above).
      - SSH_AUTH_SOCK=/ssh-agent
      # Name the store location explicitly. The automatic derivation walks
      # a symlink-installed src tree, and a build inside the container may
      # not have one.
      - WOJTEK_POLICY_STORE=/ros2_ws/policies
    # No command: override here on purpose - the image's CMD (sleep infinity)
    # just keeps this standing as a dev environment. Use ../dev.sh to start
    # this and get a shell in one step; edit src/ on the host as normal,
    # then `colcon build` inside the container and `ros2 run`/`ros2 launch`
    # by hand.

volumes:
  wojtek_bags:
    # Pin the name: without this compose would prefix it with the project name
    # (docker_wojtek_bags), and the migration/inspection paths below would lie.
    name: wojtek_bags
