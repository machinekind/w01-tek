controller_manager:
  ros__parameters:
    update_rate: 400

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    imu_sensor_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster

    magnetometer_broadcaster:
      type: magnetometer_broadcaster/MagnetometerBroadcaster

    forward_position_controller:
      type: position_controllers/JointGroupPositionController

    # Feed-forward torque channel for tau_ff policies: writes the joints'
    # `effort` command interface, which the MD80 interface applies as
    # impedance-mode torque_ff ON TOP of the PD servo. Spawned by the
    # launch only when the loaded policy's contract enables the head (the
    # effort interface only exists in the URDF then).
    forward_effort_controller:
      type: effort_controllers/JointGroupEffortController

joint_state_broadcaster:
  ros__parameters:
    publish_rate: 200.0

imu_sensor_broadcaster:
  ros__parameters:
    sensor_name: imu
    frame_id: imu_link
    publish_rate: 100.0

magnetometer_broadcaster:
  ros__parameters:
    # Publish rate = per-controller update_rate (controller_manager); the
    # LIS3MDL runs at 80 Hz, so publishing faster only duplicates samples.
    update_rate: 100
    sensor_name: imu
    frame_id: imu_link

# Joint order MUST match the policy actuator order (policy_meta.json):
# rear_left, rear_right, front_right, front_left x (first, second, third).
forward_position_controller:
  ros__parameters:
    joints:
      - rear_left_first_joint
      - rear_left_second_joint
      - rear_left_third_joint
      - rear_right_first_joint
      - rear_right_second_joint
      - rear_right_third_joint
      - front_right_first_joint
      - front_right_second_joint
      - front_right_third_joint
      - front_left_first_joint
      - front_left_second_joint
      - front_left_third_joint

forward_effort_controller:
  ros__parameters:
    joints:
      - rear_left_first_joint
      - rear_left_second_joint
      - rear_left_third_joint
      - rear_right_first_joint
      - rear_right_second_joint
      - rear_right_third_joint
      - front_right_first_joint
      - front_right_second_joint
      - front_right_third_joint
      - front_left_first_joint
      - front_left_second_joint
      - front_left_third_joint
