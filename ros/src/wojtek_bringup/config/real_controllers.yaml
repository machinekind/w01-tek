controller_manager:
  ros__parameters:
    # 200 Hz: the Pi 3 (Cortex-A53, no RT kernel) sustains ~240 Hz of the
    # former 400 before overrunning, and the irregular skipped cycles came
    # out as visibly jagged ramps. A rate the board holds evenly beats a
    # higher one it can't: the PD servo runs on the MD80s themselves and
    # the policy ticks on its own ctrl_dt, so this only paces target/state
    # transport. Was 400 on the Pi 5 -- restore if the robot moves back.
    update_rate: 200

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    imu_sensor_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster

    magnetometer_broadcaster:
      type: magnetometer_broadcaster/MagnetometerBroadcaster

    forward_position_controller:
      type: position_controllers/JointGroupPositionController

    # Feed-forward torque channel for tau_ff policies: writes the joints'
    # `effort` command interface, which the MD80 interface applies as
    # impedance-mode torque_ff ON TOP of the PD servo. Spawned by the
    # launch only when the loaded policy's contract enables the head (the
    # effort interface only exists in the URDF then).
    forward_effort_controller:
      type: effort_controllers/JointGroupEffortController

joint_state_broadcaster:
  ros__parameters:
    # 100 Hz: the policy ticks at 50 Hz, so 100 Hz states are already 2x
    # oversampled. At the full manager rate the /joint_states + imu
    # callbacks starved the rclpy executors of policy_node/real_io on the
    # Pi 3's A53 core (policy tick measured 20-32 Hz instead of 50,
    # constant stale-holds). NOTE: `publish_rate` is NOT a declared JSB
    # parameter in Jazzy (silently ignored); the per-controller
    # `update_rate` below is the mechanism that actually paces it, same
    # as magnetometer_broadcaster. 50 Hz matches the policy tick: even
    # 100+100 Hz of broadcaster callbacks capped the rclpy policy tick
    # at ~34 Hz on this core. Observation age grows to <=20 ms (was
    # ~2.5 ms on the Pi 5 at full rate) -- drop these lines to restore
    # if the robot moves back.
    update_rate: 50

imu_sensor_broadcaster:
  ros__parameters:
    sensor_name: imu
    frame_id: imu_link
    # Same story as joint_state_broadcaster: publish_rate is ignored,
    # update_rate is the real pacing knob.
    update_rate: 50

magnetometer_broadcaster:
  ros__parameters:
    # Publish rate = per-controller update_rate (controller_manager); the
    # LIS3MDL runs at 80 Hz, so publishing faster only duplicates samples.
    update_rate: 100
    sensor_name: imu
    frame_id: imu_link

# Joint order MUST match the policy actuator order (policy_meta.json):
# rear_left, rear_right, front_right, front_left x (first, second, third).
forward_position_controller:
  ros__parameters:
    joints:
      - rear_left_first_joint
      - rear_left_second_joint
      - rear_left_third_joint
      - rear_right_first_joint
      - rear_right_second_joint
      - rear_right_third_joint
      - front_right_first_joint
      - front_right_second_joint
      - front_right_third_joint
      - front_left_first_joint
      - front_left_second_joint
      - front_left_third_joint

forward_effort_controller:
  ros__parameters:
    joints:
      - rear_left_first_joint
      - rear_left_second_joint
      - rear_left_third_joint
      - rear_right_first_joint
      - rear_right_second_joint
      - rear_right_third_joint
      - front_right_first_joint
      - front_right_second_joint
      - front_right_third_joint
      - front_left_first_joint
      - front_left_second_joint
      - front_left_third_joint
