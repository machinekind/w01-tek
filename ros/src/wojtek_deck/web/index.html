<!DOCTYPE html>
<!-- The deck panel, served by wojtek_deck/deck_gateway.py. Self-contained:
     the fonts sit next to this file and nothing is fetched from the network,
     because the robot's wifi has no internet. Charts read foxglove_bridge
     directly (bridge.js), commands go to the gateway (/ws), the camera is
     the gateway's MJPEG stream.

     The look is the Machinekind design system, dark context: an ink ground,
     white text at three strengths, regions divided by 1px hairlines, and one
     accent -- soft red. Red at full strength is a fill only (the armed
     button, the dead-man frame). The camera sits plain in the middle; the
     reticle, horizon and detections are drawn on its overlay canvas
     (deck.js). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Wojtek deck</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="deck.css">
</head>
<body>
<header class="top">
  <!-- The Machinekind mark from the brand kit, in currentColor. -->
  <img class="mark" src="mark.svg" alt="Machinekind" onerror="this.style.visibility='hidden'">
  <div class="brand">Wojtek</div>
  <div class="lamps">
    <span class="lamp" id="lamp-link">link</span>
    <span class="lamp" id="lamp-bridge">bridge</span>
    <span class="lamp" id="lamp-cam">cam —</span>
    <span class="lamp" id="lamp-pad">pad</span>
    <span class="lamp" id="lamp-det">det</span>
  </div>
  <span class="policy" id="policy"></span>
  <div class="readouts">
    <span>H <b id="height">—</b> m</span>
    <span id="hud-clock"></span>
  </div>
</header>

<main class="grid">
  <section class="col">
    <div class="panel">
      <div class="kicker">attitude</div>
      <canvas id="ch-att"></canvas>
      <div class="row"><span id="att-r">roll —</span><span id="att-p">pitch —</span></div>
    </div>
    <div class="panel">
      <div class="kicker">gyro</div>
      <canvas id="ch-gyro"></canvas>
      <div class="row"><span class="k">z</span><span id="gyro-z">— rad/s</span></div>
    </div>
  </section>

  <section class="center">
    <div class="viewport" id="viewport">
      <img id="cam" alt="" src="stream.mjpg">
      <canvas id="overlay"></canvas>
      <div class="hud hud-tl" id="hud-cam">fwd cam · —</div>
      <div class="hud hud-tr" id="hud-det">no detector</div>
      <div class="speed"><b id="speed">0.00</b><span class="unit">m/s</span></div>
    </div>
    <div class="drive" id="drive">idle</div>
  </section>

  <section class="col">
    <div class="panel">
      <div class="kicker"><span id="eff-title">joint targets</span></div>
      <canvas id="ch-eff"></canvas>
      <div class="row hot"><span class="k" id="eff-name">—</span><span id="eff-val">—</span></div>
    </div>
    <div class="panel systems">
      <div class="kicker">systems</div>
      <div class="row"><span class="k">cpu</span><span id="sys-cpu">—</span></div>
      <div class="bar"><i id="bar-cpu"></i></div>
      <div class="row"><span class="k">soc</span><span id="sys-soc">—</span></div>
      <div class="bar"><i id="bar-soc"></i></div>
      <div class="row"><span class="k">wifi tx</span><span id="sys-wifi">—</span></div>
      <div class="bar"><i id="bar-wifi"></i></div>
      <div class="row"><span class="k">tick</span><span id="sys-tick">—</span></div>
      <div class="row warn" id="sys-flags"><span class="k">power</span><span id="sys-flag">—</span></div>
    </div>
  </section>

  <div class="controls">
    <button data-call="arm" id="btn-arm">arm</button>
    <button data-call="zero">zero</button>
    <button data-call="stand_up">stand</button>
    <button data-call="lie_down">lie</button>
    <button data-call="enable" id="btn-enable">policy</button>
    <button data-call="reset">reset</button>
    <span class="sep"></span>
    <button class="trick" data-call="trick_paw_wave">paw</button>
    <button class="trick" data-call="trick_bow">bow</button>
    <button class="trick" data-call="trick_sit">sit</button>
    <button class="trick" data-call="trick_shake">shake</button>
    <span class="spacer"></span>
    <button data-height="-0.005">h −</button>
    <button data-height="0.005">h +</button>
  </div>

  <div class="panel strip">
    <div class="kicker">command</div>
    <canvas id="ch-cmd"></canvas>
    <div class="log" id="log"></div>
  </div>
</main>

<script type="module" src="deck.js"></script>
</body>
</html>
