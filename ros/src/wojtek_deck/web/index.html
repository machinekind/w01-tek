<!DOCTYPE html>
<!-- The deck panel, served by wojtek_deck/deck_gateway.py. Self-contained:
     no fonts or scripts from the network, because the robot's wifi has no
     internet. Charts read foxglove_bridge directly (bridge.js), commands go
     to the gateway (/ws), the camera is the gateway's MJPEG stream.

     The camera fills the screen; everything else is drawn on it the way a
     head-up display is: one colour, one line weight, symbology instead of
     panels. The overlay canvas carries the heading tape, pitch ladder,
     speed and height tapes and the detection brackets (deck.js). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Wojtek deck</title>
<link rel="stylesheet" href="deck.css">
</head>
<body>
<div class="screen" id="viewport">
  <img id="cam" alt="" src="stream.mjpg">
  <canvas id="overlay"></canvas>

  <!-- top-left: link state as words -->
  <div class="hud words" id="words">
    <span class="lamp" id="lamp-link">link</span>
    <span class="lamp" id="lamp-bridge">bridge</span>
    <span class="lamp" id="lamp-cam">cam —</span>
    <span class="lamp" id="lamp-pad">pad</span>
    <span class="lamp" id="lamp-det">det</span>
  </div>
  <div class="hud clock" id="hud-clock"></div>
  <div class="hud policy" id="policy"></div>

  <!-- bottom-left: three strips -->
  <div class="strips">
    <div class="strip"><span class="cap">att  roll ─  pitch ┄  deg</span><canvas id="ch-att"></canvas></div>
    <div class="strip"><span class="cap">gyro  x ─  y ┄  z ┈  rad/s</span><canvas id="ch-gyro"></canvas></div>
    <div class="strip"><span class="cap">cmd  vx ─  vy ┄  wz ┈</span><canvas id="ch-cmd"></canvas></div>
  </div>

  <!-- bottom-right: readouts and the last service verdicts -->
  <div class="hud readouts">
    <div class="row"><span>tick</span><span id="ro-tick">—</span></div>
    <div class="row"><span>cpu · soc</span><span id="ro-sys">—</span></div>
    <div class="row"><span>wifi rx · tx</span><span id="ro-wifi">—</span></div>
    <div class="row"><span id="ro-eff-label">joint max</span><span id="ro-eff">—</span></div>
    <div class="row warn" id="ro-flags"><span>power</span><span id="ro-flag">—</span></div>
  </div>
  <div class="hud log" id="log"></div>

  <!-- mode word -->
  <div class="hud drive" id="drive">idle</div>

  <!-- bottom edge: the services, as words -->
  <div class="hud controls">
    <button data-call="arm" id="btn-arm">arm</button>
    <button data-call="zero">zero</button>
    <button data-call="stand_up">stand</button>
    <button data-call="lie_down">lie</button>
    <button data-call="enable" id="btn-enable">policy</button>
    <button data-call="reset">reset</button>
    <span class="sep"></span>
    <button data-call="trick_paw_wave">paw</button>
    <button data-call="trick_bow">bow</button>
    <button data-call="trick_sit">sit</button>
    <button data-call="trick_shake">shake</button>
    <span class="sep"></span>
    <button data-height="-0.005">h −</button>
    <button data-height="0.005">h +</button>
  </div>
</div>

<script type="module" src="deck.js"></script>
</body>
</html>
