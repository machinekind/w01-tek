# The local costmap: what is around the robot, in the odom frame, with memory.
#
# An ordinary ROS parameter file loaded by the nav2_costmap_2d node itself
# (--params-file). `/**/costmap` targets the node by name whatever namespace
# the launch puts it in.
#
# What this map is FOR sets every number in it. Not a map of the world: a
# rolling window around the robot, in odom, that says "obstacle / free /
# never seen" for the next few metres. The camera is a ~90-degree cone (the
# raw depth's field of view; colour-aligned depth would be 70) on a fixed
# head, blind to the sides and behind, so the one thing the window
# must do is REMEMBER: a cell marked while the crate was in view stays
# marked after the body turned away from it, until the robot either sees
# through that cell again (ray tracing clears it) or drives far enough
# that it leaves the window. Odometry drift over a 6 m window is
# centimetres, so odom is the right frame and no map frame is needed.
#
#   rolling_window / 6 x 6 m / 0.05   The window and its cell, sized to the
#                                     camera's 3 m clip in every direction
#                                     and to the noise budget the camera
#                                     bringup is written against (5 cm).
#   footprint 0.76 x 0.48             The robot's box at the home pose,
#                                     measured on the MuJoCo model with the
#                                     legs in: 0.373 x 0.230 half-extents,
#                                     rounded up. A polygon, not a radius:
#                                     the robot is twice as long as wide and
#                                     the corridors are 1.8 m.
#   track_unknown_space true          "Never seen" is a third state, not
#                                     "free". Most of the window behind a
#                                     forward camera is unknown, and a
#                                     planner decides what to do with that
#                                     (allow_unknown), not the perception.
#
# TWO observation sources on ONE point cloud, which is the standard nav2
# pattern for a camera that sees the floor:
#   depth_mark    marks only, points from 6 cm above the floor upward:
#                 anything lower is floor (or a step the legs take) and
#                 must not become a wall. The floor sits at z ~ -0.11 to
#                 -0.14 in base_link/odom (the odometry keeps z = 0 at the
#                 body, and the body stands 0.11-0.14 m up depending on the
#                 commanded height), hence -0.05.
#   depth_clear   clears only, ALL points down to the floor: a ray from
#                 the camera to a floor point passes through empty air, and
#                 that is the evidence that clears a stale mark. The marking
#                 source cannot do this because it never sees floor points.
#                 Without this split a rolling costmap fills up and never
#                 forgets -- the accumulated cloud's failure mode again.
#   voxel_layer over obstacle_layer   3D voxels, so clearing is a real ray
#                 through a 3D grid: a ray to the floor under a table clears
#                 the floor voxels, not the table top. z from -0.25 (under
#                 the lowest floor) to +0.55 (above the body: what the robot
#                 can walk under is not an obstacle).
#   ranges 0.3-3.0 m                  The camera bringup clips depth at 3 m
#                                     (radial noise beyond a cell past that)
#                                     and the D435 has no returns under 0.3.
#   inflation 0.45 m                  Half the footprint diagonal (0.45) --
#                                     the cost gradient a planner needs to
#                                     prefer the middle of a corridor; the
#                                     lethal core is the footprint itself.
#
# The heights above are in odom, i.e. levelled by the IMU through the
# odometry's roll/pitch. That is what makes a walking body's +-3 degrees
# of pitch harmless: at 3 m, 3 degrees is 15 cm, more than the 6 cm margin
# over the floor, and only the IMU keeps the floor flat in this frame.

/**/costmap:
  ros__parameters:
    autostart_node: true          # a lifecycle node that configures and
                                  # activates itself; no lifecycle manager
                                  # for a single node
    global_frame: odom
    robot_base_frame: base_link
    rolling_window: true
    width: 6
    height: 6
    resolution: 0.05
    footprint: "[[0.38, 0.24], [0.38, -0.24], [-0.38, -0.24], [-0.38, 0.24]]"
    footprint_padding: 0.0
    track_unknown_space: true
    always_send_full_costmap: true   # consumers get the whole window each
                                     # time, not deltas (2 Hz x 120x120)
    update_frequency: 5.0
    publish_frequency: 2.0
    transform_tolerance: 0.3      # the odometry TF arrives at 25-50 Hz
    plugins: ["voxel_layer", "inflation_layer"]

    voxel_layer:
      plugin: "nav2_costmap_2d::VoxelLayer"
      enabled: true
      publish_voxel_map: true     # ~/voxel_grid, for looking at it
      origin_z: -0.25
      z_resolution: 0.05
      z_voxels: 16                # -0.25 .. +0.55
      unknown_threshold: 15
      mark_threshold: 0
      combination_method: 1
      observation_sources: depth_mark depth_clear
      depth_mark:
        topic: /wojtek/nav/points
        data_type: PointCloud2
        marking: true
        clearing: false
        min_obstacle_height: -0.05
        max_obstacle_height: 0.50
        obstacle_min_range: 0.3
        obstacle_max_range: 3.0
        inf_is_valid: false
        observation_persistence: 0.0
        expected_update_rate: 0.0
      depth_clear:
        topic: /wojtek/nav/points
        data_type: PointCloud2
        marking: false
        clearing: true
        min_obstacle_height: -0.25
        max_obstacle_height: 0.50
        raytrace_min_range: 0.3
        raytrace_max_range: 3.2
        inf_is_valid: false
        observation_persistence: 0.0
        expected_update_rate: 0.0

    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      enabled: true
      inflation_radius: 0.45
      cost_scaling_factor: 3.0
      inflate_unknown: false
      inflate_around_unknown: false
