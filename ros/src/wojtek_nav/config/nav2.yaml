# Nav2 without a map: plan and follow in the odom frame, on the same rolling
# perception the standalone costmap (costmap.yaml) is built from.
#
# What this configuration is FOR. The VLM hands over a goal a few metres
# away (a point, no orientation); the robot has to reach it around the
# things a forward depth camera has seen. That is a local problem, so there
# is no map frame, no map_server, no static layer and no AMCL: both costmaps
# are rolling windows in odom, the global one just larger than the local
# one. Over 10 m the leg odometry drifts centimetres, which is inside a cell.
# Where a number repeats costmap.yaml (footprint, heights, ranges, the two
# observation sources on one cloud) the argument is there and not here.
#
# Derived from J. Delicat's first Nav2 configuration (archive/deli/nav2,
# 2026-08-07), with the map, the lidar sources, the DWB critics, the
# collision monitor and the waypoint follower taken out.
#
# Lifecycle nodes: controller_server, planner_server, behavior_server,
# bt_navigator. No smoother_server or velocity_smoother: the default
# behavior tree does not call the smoother, and the policy already takes a
# stepped /cmd_vel (goto_node publishes one at 10 Hz today).

bt_navigator:
  ros__parameters:
    global_frame: odom
    robot_base_frame: base_link
    odom_topic: /wojtek/odom
    transform_tolerance: 0.3
    # The stock trees (navigate_to_pose_w_replanning_and_recovery and its
    # through-poses twin): replan at 1 Hz, follow, and on failure clear the
    # costmaps, spin, wait, back up. They are bt_navigator's built-in
    # defaults, so no default_nav_*_bt_xml here -- a find-pkg-share
    # substitution in the path would only be resolved by nav2_bringup's
    # RewrittenYaml, which this launch does not use. Recoveries are
    # rewritten once the robot has run this (see the README).
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_name_prefixes:
      - compute_path
      - follow_path
      - nav_to_pose
      - nav_thru_poses
      - spin
      - backup
      - wait

controller_server:
  ros__parameters:
    # 10 Hz: the policy's cmd_vel watchdog is 0.2 s (policy_node), so the
    # follower must talk at least every 100 ms while it drives.
    controller_frequency: 10.0
    odom_topic: /wojtek/odom
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.5      # never commands vy (see FollowPath)
    min_theta_velocity_threshold: 0.01
    failure_tolerance: 0.5
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.15
      movement_time_allowance: 10.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      # The same reach radius goto_node uses. The goal is a POINT: the VLM
      # gives no heading, so any yaw counts (pi and beyond = never a
      # rotate-to-goal at the end).
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 3.2
    FollowPath:
      # Pure pursuit rather than DWB: one lookahead and a speed, no critic
      # weights to tune for a gait we cannot model. The policy takes vx and
      # wz; vy stays zero so the robot walks the way it was driven so far.
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.3          # goto_node's v_max
      lookahead_dist: 0.5
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.8
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.3
      min_approach_linear_velocity: 0.08
      approach_velocity_scaling_dist: 0.5
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      # Off: it reads the inflation gradient, and the local costmap has
      # none (see local_costmap). Curvature and the approach distance
      # regulate the speed instead.
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.6
      regulated_linear_scaling_min_speed: 0.15
      use_fixed_curvature_lookahead: false
      use_rotate_to_heading: true       # turn in place first, like goto_node
      rotate_to_heading_min_angle: 0.6  # goto_node's turn_in_place_rad
      rotate_to_heading_angular_vel: 0.5  # goto_node's w_max
      max_angular_accel: 1.5
      allow_reversing: false            # the camera looks forward only
      max_robot_pose_search_dist: 5.0

local_costmap:
  local_costmap:
    ros__parameters:
      # costmap.yaml's window (same size, sources, heights, ranges), the one
      # the follower and the recovery behaviours check the BODY against --
      # and therefore WITHOUT the inflation layer. Nav2's collision checker
      # scores the footprint's edges and calls anything at or above the
      # inscribed cost a hit, and the inflation layer paints that cost over
      # every cell within the inscribed radius (0.24 m here) of an obstacle.
      # For a 0.76 x 0.48 body that turns the exact polygon into a 0.69 m
      # circle: in a 1.8 m corridor a rotate-to-heading or a Spin recovery
      # passed only within 0.2 m of the centreline (seen in the sim: 21
      # "detected collision ahead" over four goals, one goal lost to Spin
      # and BackUp both "Collision Ahead" beside a wall 0.66 m away). Lethal
      # only, and the check is the polygon it was configured with. The
      # planner keeps its gradient in the global costmap below; the follower
      # does not need one (cost-regulated scaling off in FollowPath).
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      footprint: "[[0.38, 0.24], [0.38, -0.24], [-0.38, -0.24], [-0.38, 0.24]]"
      footprint_padding: 0.0
      track_unknown_space: true
      always_send_full_costmap: true
      transform_tolerance: 0.3
      plugins: ["voxel_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: false
        origin_z: -0.25
        z_resolution: 0.05
        z_voxels: 16
        unknown_threshold: 15
        mark_threshold: 0
        combination_method: 1
        observation_sources: depth_mark depth_clear
        depth_mark:
          topic: /wojtek/nav/points
          data_type: PointCloud2
          marking: true
          clearing: false
          min_obstacle_height: -0.05
          max_obstacle_height: 0.50
          obstacle_min_range: 0.3
          obstacle_max_range: 3.0
          inf_is_valid: false
          observation_persistence: 0.0
          expected_update_rate: 0.0
        depth_clear:
          topic: /wojtek/nav/points
          data_type: PointCloud2
          marking: false
          clearing: true
          min_obstacle_height: -0.25
          max_obstacle_height: 0.50
          raytrace_min_range: 0.3
          raytrace_max_range: 3.2
          inf_is_valid: false
          observation_persistence: 0.0
          expected_update_rate: 0.0

global_costmap:
  global_costmap:
    ros__parameters:
      # The planner's window: the same layers, 10 x 10 m so a goal a few
      # metres out and the detour around it both fit, updated at 1 Hz
      # because the tree replans at 1 Hz. Still rolling, still odom -- the
      # "global" is Nav2's word for the planner's map, not ours for the
      # world.
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05
      footprint: "[[0.38, 0.24], [0.38, -0.24], [-0.38, -0.24], [-0.38, 0.24]]"
      footprint_padding: 0.0
      track_unknown_space: true
      always_send_full_costmap: true
      transform_tolerance: 0.5
      plugins: ["voxel_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: false
        origin_z: -0.25
        z_resolution: 0.05
        z_voxels: 16
        unknown_threshold: 15
        mark_threshold: 0
        combination_method: 1
        observation_sources: depth_mark depth_clear
        depth_mark:
          topic: /wojtek/nav/points
          data_type: PointCloud2
          marking: true
          clearing: false
          min_obstacle_height: -0.05
          max_obstacle_height: 0.50
          obstacle_min_range: 0.3
          obstacle_max_range: 3.0
          inf_is_valid: false
          observation_persistence: 0.0
          expected_update_rate: 0.0
        depth_clear:
          topic: /wojtek/nav/points
          data_type: PointCloud2
          marking: false
          clearing: true
          min_obstacle_height: -0.25
          max_obstacle_height: 0.50
          raytrace_min_range: 0.3
          raytrace_max_range: 3.2
          inf_is_valid: false
          observation_persistence: 0.0
          expected_update_rate: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.45
        cost_scaling_factor: 3.0
        inflate_unknown: false
        inflate_around_unknown: false

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.3
      use_astar: false
      # Most of a rolling window behind a forward camera is "never seen";
      # the planner may cross it (the perception keeps it a third state
      # for exactly this decision, see costmap.yaml).
      allow_unknown: true

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.5
