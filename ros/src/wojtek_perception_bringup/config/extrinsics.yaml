# Camera -> body extrinsics, published as a static transform.
#
# THESE ARE PLACEHOLDERS. Measure or calibrate them before trusting anything
# downstream of the depth stream.
#
# Why this is a file and not a calibration node: calibration is a one-shot
# procedure that produces numbers. Running it at every boot would either
# recompute a constant or sit in the graph doing nothing. The bringup reads
# the result; the procedure that produces it is a tool, run by hand.
#
# Why it matters more than it looks: the pitch component dominates every
# ground/obstacle decision at range. A 1 deg pitch error puts a floor point
# 52 mm off at 3 m, and 3 deg puts it 157 mm off -- a full stair riser, and
# ~5x the sensor's own noise at that distance. A constant mounting error
# reads downstream as a permanent phantom wall a few metres ahead.
#
# Frame convention: ROS REP-103 for the parent (x forward, y left, z up).
# The child is the driver's camera_link, NOT an optical frame -- the driver
# publishes camera_link -> *_optical_frame itself.

static_transform:
  parent_frame: base_link
  child_frame: camera_link

  # Translation [m], camera origin in the body frame.
  x: 0.0
  y: 0.0
  z: 0.0

  # Rotation [rad]. `pitch` is the one to get right: positive tilts the
  # camera down, trading far range for near-field ground resolution.
  roll: 0.0
  pitch: 0.0
  yaw: 0.0
