[project]
name = "wojtek-rl"
version = "0.1.0"
description = "RL locomotion for four_bar_bot: MJX + Brax PPO"
requires-python = ">=3.11,<3.13"
dependencies = [
    # jax 0.9.2 is the proven pin for this driver family; cuda extra only on linux
    "jax[cuda12]==0.9.2; sys_platform == 'linux'",
    "jax==0.9.2; sys_platform == 'darwin'",
    "mujoco>=3.2.0",
    "mujoco-mjx>=3.2.0",
    # mujoco-mjx 3.10.0 vendors MJWarp and requires exactly this warp-lang.
    # 1.14 removed warp._src.jax_experimental and breaks put_model(impl="warp").
    "warp-lang==1.13.0",
    "brax>=0.12.1",
    "playground>=0.0.4",
    "ml-collections>=0.1.1",
    "wandb>=0.23.0",
    "loguru>=0.7.3",
    "tqdm",
    "numpy",
    "imageio",
    "imageio-ffmpeg",
    "matplotlib",
    "mediapy",
    "hydra-core>=1.3.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.14.1"]
demo = ["fastapi", "uvicorn[standard]", "wsproto", "pillow"]
# Room-scan asset pipeline (room_assets.py / build_room.py); heavy geometry
# deps kept out of the default install.
room = ["trimesh>=4.0", "coacd>=1.0.0", "pillow"]
# VLM navigation bridge (fbb_rl/vlm_nav.py); needs ANTHROPIC_API_KEY at runtime.
vlm = ["anthropic>=0.40"]
# On-device VLM backend (wojtek_brain/vlm_local.py): Qwen3-VL via mlx-vlm,
# Apple Silicon only; weights pulled from HuggingFace on first use.
vlm-local = ["mlx-vlm>=0.3.3", "pillow"]
# Navigation evaluation harness (wojtek_eval/): kinematic sim, occupancy
# mapping, spoken-instruction chain, remote VLM client.
eval = ["trimesh>=4.0", "pillow", "faster-whisper>=1.0"]
# Engine-parameter identification from rosbags (wojtek_rl/sysid/):
# ROS-free ros2 bag reader + CMA-ES.
sysid = ["rosbags>=0.10", "cmaes>=0.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wojtek_rl", "wojtek_eval"]
