defaults:
  - task: joystick
  - network: default
  - obs: full # sensor-suite preset: full / no_imu (subtracts from obs.state)
  - _self_

run_name: null # default: <task>_<timestamp>
seed: 0
smoke: false # tiny CPU-sized run for a pipeline check
restore: null # checkpoint dir to warm-start from
domain_rand: true

# Extra domain-randomization fields, off by default. With all disabled, DR
# is the original set: floor friction, base and link mass, one gain/kd scale.
dr:
  com_offset: { enable: false, xy: 0.02, z: 0.01 } # body_ipos on root, +-m
  joint_gains: { enable: false, gain_pct: 0.2, kd_pct: 0.2 } # per-joint, else single scalar
  dof: # multiplicative ranges
    enable: false
    damping: [0.9, 1.1]
    armature: [0.9, 1.1]
    frictionloss: [0.9, 1.1]
  # Per-foot-geom, multiplicative. Also gives the foot geoms contact
  # priority, so the foot's draw is the contact friction and the floor's
  # (including its DR draw) no longer affects foot contacts.
  foot_friction: { enable: false, range: [0.8, 1.2] }
  # Per-actuator forcerange scale, decoupled from joint_gains' gain draw;
  # weak-skewed because the real failure is motors too weak to pull the hips
  # back under the body, not a symmetric strength spread.
  motor_strength: { enable: false, range: [0.5, 1.1] }

# Random Network Distillation exploration bonus, off by default. Enabled,
# training runs the vendored trainer fork (wojtek_rl/ppo_rnd.py): a frozen
# random target MLP + a trained predictor over `obs_key`; the predictor's
# per-transition MSE, RMS-normalized, times `coef`, is added to the env
# reward before GAE. `coef` is in units of the RMS-normalized bonus (~1.0
# early), so weigh it against the per-step extrinsic reward (~0.1-0.3 on
# the flat task) — 0.01-0.05 is gentle pressure, 0.5 would dominate.
rnd:
  enable: false
  coef: 0.02
  learning_rate: 1e-4
  out_dim: 128
  hidden: [256, 256]
  obs_key: privileged_state # novelty in true-state space, not actor obs

wandb:
  enable: true
  project: fbb-locomotion

# Reward-plateau early stopping, off by default. Checked at every PPO eval:
# once `min_evals` evals have run, stop when no eval has beaten the best
# reward so far by more than `min_delta` within the last `patience` evals.
# Aborting mid-train is safe: brax saves a checkpoint at every eval, so the
# latest checkpoint IS the early-stopped policy; run.json records the stop.
# Give the run enough evals to make this meaningful (e.g. ++ppo.num_evals=40
# on a 2B-step ceiling checks every 50M steps).
early_stop:
  enable: false
  min_evals: 10 # never stop before this many evals
  patience: 6 # evals without a new best before stopping
  min_delta: 0.5 # reward improvement below this does not count as a new best

# Free-form overrides applied onto the tuned playground Go1 PPO config,
# after the task's own ppo block (so CLI ppo.foo=... wins).
ppo: {}

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
