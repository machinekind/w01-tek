# @package _global_
# SELF-IDENT PROBE, END-TO-END (2026-08-16): no hand-chosen excitation
# proxies. The trainer fork's selfident mode (EPI-style, arXiv
# 1907.11740) trains an online estimator (actor obs -> the 44-dim
# env_factors appended last in the privileged list) and pays the policy
# the estimator's OWN prediction error as intrinsic reward: the probe
# seeks whatever motions leave its parameters ambiguous, and the
# estimator sharpens on exactly that data. Extrinsic terms are only
# constraints (stand near zero command, do not fall, do not thrash);
# every information signal is learned.
# Judge with the dance-scatter protocol (true vs predicted on unseen DR
# draws, full-dance aggregation) against the proxy probe
# (wojtek_flat_probe_v1_s0) and the keeper-walking baseline.
# Usage: ./training/run.sh train +experiment=flat_probe_e2e_v1 seed=0
defaults:
  - override /task: joystick

task:
  env:
    action_scale: [0.25, 0.25, 0.25]
    pd_kp: 40.0
    pd_kd: 0.8
    max_torque: 12.0
    abduction_ctrl_limit: 0.44
    knee_target_max: 3.15
    latency:
      enable: true
    encoder:
      enable: true
    obs:
      history_len: 25
      state:
        - gyro
        - gravity
        - joint_pos
        - joint_vel
        - last_act
        - command
        - phase
        - proprio_history
      include:
        - joint_pos
        - joint_vel
        - last_act
        - command
        - proprio_history
      privileged:
        - gyro
        - gravity
        - joint_pos
        - joint_vel
        - last_act
        - command
        - linvel
        - foot_contact
        - env_factors
    command:
      vx: [0.0, 0.0]
      vy: [0.0, 0.0]
      wz: [0.0, 0.0]
      height: [0.125, 0.125]
      zero_prob: 1.0
    reward:
      scales:
        tracking_lin_vel: 0.0
        tracking_ang_vel: 0.0
        feet_apex: 0.0
        feet_air_time: 0.0
        feet_phase: 0.0
        contact_match: 0.0
        stand_still: 0.0
        stand_feet_down: 0.0
        pose: -0.25
        orientation: -5.0
        feet_slip: 0.0
        action_rate: -0.1
        torques: 0.0
        termination: -10.0

dr:
  com_offset: { enable: true, xy: 0.02, z: 0.01 }
  joint_gains: { enable: true, gain_pct: 0.2, kd_pct: 0.2 }
  motor_strength: { enable: true, range: [0.5, 1.1] }
  foot_friction: { enable: true, range: [0.3, 2.2] }

rnd:
  enable: true
  mode: selfident
  obs_key: state
  target_key: privileged_state
  target_dim: 44
  coef: 1.0
  learning_rate: 3.0e-4

ppo:
  num_timesteps: 500000000

run_name: wojtek_flat_probe_e2e_v1
