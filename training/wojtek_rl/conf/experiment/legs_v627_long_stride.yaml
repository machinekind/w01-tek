# @package _global_
# The v6.27 legs with a slower clock and a reason to use it: the first
# deployable policy on these legs (wojtek_legs_v627_loco_v3, 2026-10-22)
# minced -- front stride span 0.14 m at 0.3-0.5 m/s, stance fraction 0.7,
# foot slip 0.07-0.24 m/s -- against 0.21 m for the clock-observing v2b.
# Three levers from the literature, each mapped to a knob that exists here:
#   * a lower clock band, the way a pendulum of 2.3x the length swings
#     slower (Walk These Ways conditions the policy on 0.5-4 Hz and gets
#     the stride to follow); duty closer to a real walk's 0.65 and a
#     higher swing apex so the knee has to fold.
#   * swing time paid for (Rudin 2022's feet_air_time, there offset by
#     0.5 s), capped so hopping cannot farm it.
#   * work priced harder (Fu, Kumar, Malik 2021: minimizing torque x
#     velocity alone makes walking/trotting emerge; 2403.20001 scales that
#     weight with the commanded speed), and the pose pull halved, since
#     it is the term that keeps the knees near the stance angle.
# Observations stay what the robot measures; add `task.env.obs.include`
# with gyro and gravity on the command line for the IMU variant.
# Usage: ./run.sh train +experiment=legs_v627_long_stride run_name=<name>
defaults:
  - legs_v627_locomotion

task:
  env:
    gait:
      freq: [0.5, 1.3]
      duty: [0.65, 0.5]
      swing_height: 0.09
      air_time_cap: 0.7
    reward:
      apex_target: 0.07
      scales:
        feet_air_time: 6.0
        feet_apex: 0.5
        pose: -0.25
        energy: -6.0e-3
        feet_slip: -0.5

run_name: wojtek_legs_v627_long_stride
