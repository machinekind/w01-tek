# @package _global_
# springy_v2 — the keeper candidate of the 2026-07-17 anti-nosedive run,
# FROZEN from the trained run wojtek_springy_b_v2_20260717_1426 so it stays
# reproducible while the springy_phase_* presets evolve. What it is:
# springy_v1's recipe retrained on the corrected 14 kg model (commit
# 743e0dc) with the anti-nosedive package: ang_vel_xy restored at -0.3 and
# fall.max_tilt_gz tightened to -0.6 (~53 deg). Battery vs v1 on the same
# 14 kg model: ramp vel_err 0.072 (v1 0.106), walk_to_stop 0.054 (0.074),
# spin 0.484 (0.621); pitch-down p95 turn 1.5 deg (2.37), strafe 2.3 (3.12);
# zero falls; quiet stance qvel 0.006 unchanged. The v1 step-command freeze
# (stand under vx >= 0.9 from standstill) is gone: tracks 1.03 at cmd 1.2.
# Known regression: strafe vibration 0.49 (v1 0.34).
# Trained as the two-phase pipeline (training/hpc/springy_two_phase.slurm)
# at commit 3cf32c6, seed 1, ++ppo.num_envs=32768 ++ppo.batch_size=1024:
# phase A 1.2B steps (penalties at 0.3x, eased difficulty), phase B 800M
# restored from A's final checkpoint. WandB: WANDB_ENTITY/fbb-locomotion runs
# 18o824hm (A) and co41bo1c (B).
# Artifacts: https://huggingface.co/<HF_ORGANIZATION>/wojtek-springy-locomotion-v2
# Usage: ./run.sh train +experiment=locomotion_springy_v2
defaults:
  - override /task: joystick

task:
  env:
    action_scale: [0.25, 0.5, 0.5]
    max_torque: 6.0
    abduction_ctrl_limit: 0.44
    knee_target_max: 3.15
    fall:
      max_tilt_gz: -0.6
    latency:
      enable: true
    encoder:
      enable: true
    obs:
      include:
        - joint_pos
        - joint_vel
        - last_act
        - command
    command:
      vx: [-0.8, 1.2]
      vy: [-0.5, 0.5]
      wz: [-1.0, 1.0]
      height: [0.125, 0.125]
      zero_prob: 0.25
      pure_wz_prob: 0.25
      pure_vy_prob: 0.2
    push:
      vel: 0.8
    gait:
      swing_height: 0.08
      air_time_cap: 0.35
    reward:
      tracking_sigma: 0.1
      pose_leg_weight: 0.1
      scales:
        tracking_lin_vel: 4.0
        tracking_ang_vel: 1.6
        height_tracking: 0.0
        lin_vel_z: 0.0
        ang_vel_xy: -0.3
        orientation: -5.0
        torques: -6.0e-4
        torque_rate: -0.02
        torque_limit: -0.1
        action_rate: -0.25
        action_accel: 0.0
        energy: 0.0
        pose: -1.0
        feet_air_time: 4.0
        feet_slip: -0.35
        feet_phase: 0.0
        contact_match: 0.0
        high_step: 4.0
        stand_still: -2.5
        stand_feet_down: -30.0
        termination: -1.0

dr:
  motor_strength: { enable: true, range: [0.5, 1.1] }

run_name: wojtek_loco_springy_v2
