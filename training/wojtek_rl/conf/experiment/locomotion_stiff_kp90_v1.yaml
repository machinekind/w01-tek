# @package _global_
# stiff_kp90_v1 — keeper v2 (maximum stiffness) of the stiffness ladder +
# consolidation experiment, FROZEN from the trained run
# wojtek_stiff_kp90c_20260719_105503 (job NNNNNNN, seed 1) so it stays
# reproducible. What it is: the kp40/kd1.6 keeper (locomotion_stiff_v1,
# wojtek_stiff_b_20260717_235321) walked up the stiffness ladder to kp80
# (kp50 -> 60 -> 70 -> 80, +400M steps/rung), extended one rung further to
# kp90 (restored from the kp80 ladder winner,
# wojtek_stiff_kp80_20260718_100225), then given +800M consolidation steps
# at the same kp90/kd2.40 operating point (2.0B keeper + 5x400M ladder +
# 800M consolidation = 4.8B cumulative steps). PD gains patched onto the
# model at load via task.env.pd_kp/pd_kd (kp 40 -> 90, kd 1.6 -> 2.40,
# holding the keeper's damping ratio: kd = 1.6*sqrt(kp/40)); torque cap
# unchanged at 9 Nm; per-joint joint_gains DR at +-20% hedging the
# unmeasured real motor Kt. Consolidation restored from
# runs/wojtek_stiff_kp90_20260718_141500/checkpoints/000412876800 (the kp90
# ladder rung's own latest checkpoint, not a fresh start) -- restore itself
# is a launch-time flag, not set in this preset.
# Sim ceiling: kp100 (one rung further) was rejected at 5.7% torque
# saturation, over the ladder's 5% gate -- kp90 is the stiffest accepted
# operating point at the 9 Nm cap.
# Battery (post-consolidation): mean track_err_rms 0.05468 (pre-consolidation
# 0.059125, -7.5%); zero falls in any of the 4 scenarios; max torque
# saturation 4.3% of steps (stand_to_trot_ramp's knee channel), under the
# ladder's 5% gate.
# Robustness grid (gates 1-4 all PASS -- no falls, vel_err/vy_err < 0.20,
# vibration <= 1.3x keeper reference, saturation < 5%): Kt miscalibration
# alpha=1.58 (uncompensated) -> mean track_err_rms 0.0498, turn
# vel_err_overall 0.16 -- consolidation FIXED the pre-consolidation kp90
# rung's marginal alpha=1.58 result (turn vel_err_overall 0.21-0.23 across
# lag 0/5/10 ms, over gate 2's 0.2 threshold); harsh speed-dependent torque
# envelope "5,12" -> mean track_err_rms 0.0546.
#
# *** DEPLOYMENT CONTRACT -- READ BEFORE ANY ROBOT USE ***
# This is the keeper trained at the sim ceiling (kp=90, +-9 Nm); unlike
# locomotion_stiff_kp80_v1 it is NOT cleared to run with an uncompensated Kt
# mismatch. Deploy ONLY after measuring the real actuators' stand-sag alpha
# (Kt miscalibration factor). Command pd_kp/alpha, pd_kd/alpha, and a torque
# cap of 9/alpha so the physical plant matches the trained one. ros/'s
# wojtek_real.urdf.xacro and the launch file's max_torque MUST carry the
# matched values before any robot use. HEIGHT_TABLE must be re-measured at
# the matched operating point before deployment.
# ***
#
# Trained on the cluster CLUSTER cluster (training/hpc/stiff_ladder.slurm +
# training/hpc/stiff_consolidate.slurm), 4xH100, ++ppo.num_envs=32768
# ++ppo.batch_size=1024.
# Artifacts: https://huggingface.co/<HF_ORGANIZATION>/wojtek-stiff-kp90-locomotion
# Sibling: https://huggingface.co/<HF_ORGANIZATION>/wojtek-stiff-kp80-locomotion
# Usage: ./run.sh train +experiment=locomotion_stiff_kp90_v1
defaults:
  - override /task: joystick

task:
  env:
    action_scale: [0.25, 0.5, 0.5]
    pd_kp: 90.0
    pd_kd: 2.4
    max_torque: 9.0
    abduction_ctrl_limit: 0.44
    knee_target_max: 3.15
    latency:
      enable: true
    encoder:
      enable: true
    obs:
      include:
        - joint_pos
        - joint_vel
        - last_act
        - command
    command:
      vx: [-0.8, 1.2]
      vy: [-0.5, 0.5]
      wz: [-1.0, 1.0]
      height: [0.125, 0.125]
      zero_prob: 0.25
      pure_wz_prob: 0.25
      pure_vy_prob: 0.2
    push:
      vel: 0.8
    gait:
      swing_height: 0.08
      air_time_cap: 0.35
    reward:
      tracking_sigma: 0.1
      pose_leg_weight: 0.1
      scales:
        tracking_lin_vel: 4.0
        tracking_ang_vel: 1.6
        height_tracking: 0.0
        lin_vel_z: 0.0
        ang_vel_xy: 0.0
        orientation: -5.0
        torques: -6.0e-4
        torque_rate: -0.02
        torque_limit: -0.1
        action_rate: -0.25
        action_accel: 0.0
        energy: 0.0
        pose: -1.0
        feet_air_time: 4.0
        feet_slip: -0.35
        feet_phase: 0.0
        contact_match: 0.0
        high_step: 4.0
        stand_still: -2.5
        stand_feet_down: -30.0
        termination: -1.0

dr:
  motor_strength: { enable: true, range: [0.5, 1.1] }
  joint_gains: { enable: true, gain_pct: 0.2, kd_pct: 0.2 }

ppo:
  num_timesteps: 800000000

run_name: wojtek_loco_stiff_kp90_v1
