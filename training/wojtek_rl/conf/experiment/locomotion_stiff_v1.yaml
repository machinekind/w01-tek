# @package _global_
# stiff_v1 — the keeper policy of the 2026-07-17 stiffness experiment,
# FROZEN from the trained run wojtek_stiff_b_20260717_235321 (job NNNNNNN)
# so it stays reproducible while the stiff_phase_* presets evolve. What it
# is: the springy clock-free design (no gait clock, no height command, legs
# as springs) moved to a stiff operating point — PD gains kp 20 -> 40, kd
# 1 -> 1.6 (patched onto the model at load via task.env.pd_kp/pd_kd; the
# committed XML keeps kp=20/kd=1), torque cap 6 -> 9 Nm, per-joint
# joint_gains DR at +-20% hedging the unmeasured real motor Kt. Ranking
# probe: kp40 held baseline velocity tracking while cutting track_err_rms
# 0.146 -> 0.094; kp60 collapsed into standing.
# Battery (phase B): zero falls; track_err_rms 0.113/0.093/0.090/0.074
# (ramp/turn/strafe/walk_to_stop); vibration 0.25/0.14/0.36/0.12, back at
# the kp20 baseline after the kd 1.4 -> 1.6 bump (the kd=1.4 probe ran
# ~2x baseline); vel_err ramp 0.071 / turn 0.13 / walk_to_stop 0.062;
# torque saturation <=1.1% at the 9 Nm cap.
# Trained as the two-phase pipeline (as-run stiff_two_phase.slurm archived
# under hpc/ in the HF repo below)
# at commit eb8bad2, seed 1, ++ppo.num_envs=32768 ++ppo.batch_size=1024:
# phase A 1.2B steps at kd=1.4, phase B (this config) 800M steps restored
# from A's final checkpoint with kd bumped to 1.6.
# DEPLOYMENT MUST MATCH: kp=40 / kd=1.6 / +-9 Nm on the robot
# (wojtek_real.urdf.xacro + launch max_torque).
# Artifacts: https://huggingface.co/<HF_ORGANIZATION>/wojtek-stiff-locomotion
# Usage: ./run.sh train +experiment=locomotion_stiff_v1
defaults:
  - override /task: joystick

task:
  env:
    action_scale: [0.25, 0.5, 0.5]
    pd_kp: 40.0
    pd_kd: 1.6
    max_torque: 9.0
    abduction_ctrl_limit: 0.44
    knee_target_max: 3.15
    latency:
      enable: true
    encoder:
      enable: true
    obs:
      include:
        - joint_pos
        - joint_vel
        - last_act
        - command
    command:
      vx: [-0.8, 1.2]
      vy: [-0.5, 0.5]
      wz: [-1.0, 1.0]
      height: [0.125, 0.125]
      zero_prob: 0.25
      pure_wz_prob: 0.25
      pure_vy_prob: 0.2
    push:
      vel: 0.8
    gait:
      swing_height: 0.08
      air_time_cap: 0.35
    reward:
      tracking_sigma: 0.1
      pose_leg_weight: 0.1
      scales:
        tracking_lin_vel: 4.0
        tracking_ang_vel: 1.6
        height_tracking: 0.0
        lin_vel_z: 0.0
        ang_vel_xy: 0.0
        orientation: -5.0
        torques: -6.0e-4
        torque_rate: -0.02
        torque_limit: -0.1
        action_rate: -0.25
        action_accel: 0.0
        energy: 0.0
        pose: -1.0
        feet_air_time: 4.0
        feet_slip: -0.35
        feet_phase: 0.0
        contact_match: 0.0
        high_step: 4.0
        stand_still: -2.5
        stand_feet_down: -30.0
        termination: -1.0

dr:
  motor_strength: { enable: true, range: [0.5, 1.1] }
  joint_gains: { enable: true, gain_pct: 0.2, kd_pct: 0.2 }

ppo:
  num_timesteps: 800000000

run_name: wojtek_loco_stiff_v1
