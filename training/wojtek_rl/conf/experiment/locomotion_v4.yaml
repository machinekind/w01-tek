# @package _global_
# Iteration 4 (battery-driven). v3 clean scores: vel_err 0.075-0.082,
# walk/trot gait correct (0.02 / 0.92), heights 3/8 mm — but the robot
# TREMBLES while standing (actuated qvel_rms 1.03 rad/s, push-free).
# v4 attacks stand quality only: heavier stand_still (position+velocity)
# and 25% zero-velocity commands for more standing/onset practice.
# Usage: ./run.sh train +experiment=locomotion_v4
defaults:
  - locomotion

task:
  env:
    command:
      zero_prob: 0.25
    gait:
      freq: [1.4, 3.6]
    reward:
      height_sigma: 5e-4
      scales:
        height_tracking: 2.0
        stand_still: -2.5
        tracking_lin_vel: 2.0

run_name: fbb_loco_v4
