# @package _global_
# Second attempt at running: fbb_run_v1 froze on 1.5+ m/s commands — the
# fixed per-episode trot clock can't reach fast speeds with 0.21 m legs.
# v2 scales the clock with the commanded speed (up to 4.5 Hz) and warm-starts
# from the v1 checkpoint. Usage: ./run.sh train +experiment=run_v2
defaults:
  - override /task: joystick

task:
  env:
    command:
      vx: [-0.8, 1.8]
      vy: [-0.5, 0.5]
      wz: [-1.0, 1.0]
    # NOTE: gait.speed_scaling was removed — the clock is always
    # speed-scaled now, and the env command grew a height slot, so this
    # preset's restore checkpoint no longer loads (obs sizes changed).
    gait:
      freq: [1.8, 4.5]
      swing_height: 0.04
    push:
      vel: 0.5

# Relative to the project dir (resolved in train.py).
restore: runs/fbb_run_v1/checkpoints/000206438400
run_name: fbb_run_v2
