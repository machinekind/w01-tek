# @package _global_
# terrain_distill -- DAgger student from the published frozen teachers.
# The env block is the terrain family's (v4.6 line), unchanged: the student
# trains on the family arena, obs layout and action contract, so every
# teacher's labels apply and every eval tool reads the run as usual.
# Rewards are logged, not optimized.
# Routing mode "command" (per step, on the command channel the student
# observes): vx=vy=0 windows (pure spin and stand) -> the flat teacher,
# every moving command -> the keeper. The tile map below is the
# routing.mode=tile alternative (per episode, simulation-side) and is
# unused while mode is command; a blind student cannot separate
# tile-routed teachers on proprioception alone, so tile mode needs an
# exteroceptive student.
# The non-default knobs are one package; each guards a distillation
# failure mode:
#   student_act: mode      -- deterministic rollouts; the scale head is
#                             untrained by the loc-only loss, so sampling
#                             through it destabilizes the loop
#   learning_rate_end      -- cosine decay; constant-rate MSE random-walks
#                             once the fit is tight
#   teacher_act_frac_end   -- beta floor keeps teacher-driven episodes in
#                             the batch to the end (hard states stay
#                             represented)
#   window_loss_weight: 4  -- window targets are the smallest actions in
#                             the batch; plain MSE sacrifices them first
# Student warm-starts from the flat teacher; the normalizer stays frozen
# at those statistics. No RL fine-tune stage exists in this recipe.
# ppo.num_timesteps is the env-step budget of the DAgger loop; the PPO
# update hyper-parameters are unused by wojtek_rl.distill.
# Launch: family arena and flags (flat row + the family terrain-geometry
# flags, no rebuild; the env refuses a mismatched arena).
# XLA_PYTHON_CLIENT_PREALLOC=false is mandatory on terrain. Single GPU:
# the distill loop does not data-parallelize, and ppo.num_envs stays at
# the preset's 8192 (a multi-GPU env count only oversizes the warp
# contact buffers).
defaults:
  - override /task: joystick

distill:
  teachers:
    keeper: runs/wojtek_terrain_blind_v4_2
    flat: runs/wojtek_terrain_blind_v4_6_s2
    soft: runs/wojtek_terrain_blind_v4_5_s2
  routing:
    mode: command
    command_window: flat
    moving: keeper
    flat_row: flat
    types:
      rough_uniform: keeper
      pyramid_stairs: keeper
      inverted_pyramid_stairs: keeper
      random_grid: keeper
      pyramid_slope: soft
      inverted_pyramid_slope: soft
      discrete_obstacles: soft
      wave: soft
  warm_start: runs/wojtek_terrain_blind_v4_6_s2
  unroll_length: 32
  epochs: 4
  num_minibatches: 32
  learning_rate: 3.0e-4
  learning_rate_end: 1.0e-5
  grad_clip: 1.0
  teacher_act_frac_start: 0.5
  teacher_act_frac_end: 0.35
  save_every_steps: 100000000
  student_act: mode
  window_loss_weight: 4.0

task:
  env:
    # Knee: window and clamp move together (raising one without the other
    # is a no-op -- stance 2.65 + 0.5 sat exactly at the old 3.15 clamp).
    action_scale: [0.25, 0.5, 1.35]
    pd_kp: 40.0
    pd_kd: 1.6
    max_torque: 32.0
    abduction_ctrl_limit: 0.44
    knee_target_max: 4.0
    latency:
      enable: true
    encoder:
      enable: true
    symmetry:
      enable: true
      mirror_prob: 0.5
    no_progress:
      enable: true
      grace_sec: 2.0
      ema_sec: 1.0
      risk_below: 0.5
      p_max: 0.02
      terrain_grace_sec: 4.0
      terrain_p_max_scale: 0.5
    obs:
      # The terrain family's frozen actor layout: the kp40 line's joint,
      # action and command channels plus the IMU (gyro and gravity, named as
      # in conf/obs/full.yaml). It is deliberately incompatible with every
      # flat checkpoint. Before this family can run on the robot, the
      # deployment side has to wire the CANdle-hat BMI into the policy node.
      include:
        - gyro
        - gravity
        - joint_pos
        - joint_vel
        - last_act
        - command
      # Critic-only list; matches the warm start's checkpoint (the frozen
      # normalizer carries stats for exactly these components).
      privileged:
        - gyro
        - gravity
        - joint_pos
        - joint_vel
        - last_act
        - command
        - linvel
        - foot_contact
        - height_scan_clean
    height_scan:
      enable: true
    command:
      vx: [-0.8, 1.2]
      vy: [-0.5, 0.5]
      wz: [-1.5, 1.5]
      height: [0.10, 0.18]
      zero_prob: 0.25
      # Flat-located spin dose (v4.4 arm C): base draw 0.40, and sticky
      # spins survive the overwrite chain on flat rows (survival 0.346 ->
      # 1.0). Terrain rows keep terrain_bias probs and are untouched.
      pure_wz_prob: 0.40
      pure_wz_sticky: true
      pure_vy_prob: 0.2
      arc_prob: 0.2
      arc_vx: [0.3, 0.8]
      pure_slow_prob: 0.1
      slow_vx: [0.15, 0.35]
      # A draw probability, not a realized share: the zero overwrite
      # runs last, so 0.2 lands at 0.15 of commands as clean backward.
      pure_back_prob: 0.2
      back_vx: [-0.8, -0.2]
      # Terrain rows lean forward; the flat row keeps the base mix above.
      terrain_bias:
        enable: true
        zero_prob: 0.10
        pure_wz_prob: 0.10
        pure_vy_prob: 0.05
        pure_slow_prob: 0.30
        pure_back_prob: 0.10
    push:
      vel: 0.8
    gait:
      swing_height: 0.08
      air_time_cap: 0.35
    reward:
      tracking_rel_sigma: 0.5
      tracking_rel_floor_ang: 0.7
      tracking_far_weight: 0.25
      tracking_far_sigma: 2.5
      pose_leg_weight: 0.1
      tracking_product: true
      tracking_relative: true
      shaping_tracking_gate: true
      torque_limit_frac: 0.25
      orientation_tol_deg: 20.0
      apex_target: 0.05
      terrain_gate:
        enable: true
        floor: 0.15
        rough_ref: 0.05
        landing_soften: 0.5
        flat_pitch_tol_deg: 2.0
        flat_pitch_rough_cut: 0.15
        flat_pitch_row_only: true
        flat_pitch_spin_exempt: true
      scales:
        tracking_lin_vel: 4.0
        tracking_ang_vel: 2.4
        height_tracking: 1.0
        lin_vel_z: 0.0
        ang_vel_xy: 0.0
        orientation: -5.0
        flat_pitch: -10.0
        torques: -6.0e-4
        torque_rate: -0.02
        torque_limit: -0.2
        action_rate: -0.25
        action_accel: 0.0
        energy: 0.0
        pose: -1.0
        feet_air_time: 4.0
        feet_slip: -0.35
        feet_phase: 0.0
        contact_match: 0.0
        feet_apex: 5.0
        feet_landing: -0.5
        high_step: 4.0
        stand_still: -2.5
        stand_feet_down: -30.0
        termination: -1.0
    terrain:
      enable: true
      arena: train
      flat_row: true
      spawn_mode: feature
      spawn_grace_sec: 1.0
      pinned_frac: 0.2
      # A dedicated tenth of the fleet pinned to the flat row at level 0;
      # comes out of the ladder population (80% -> 70%). The frozen
      # one-per-rung 0.2 slice above is untouched.
      pinned_flat_frac: 0.10
      demote_strikes: 3
      stair_tread_range: [0.25, 0.45]
      pad_radius: 0.3
      # Sized to the opened legs (~9 cm of usable lift): stairs top out at
      # 7 cm risers, blocks at ~6.6 cm, rubble boxes at ~7 cm.
      type_caps:
        pyramid_stairs: 0.7
        inverted_pyramid_stairs: 0.7
        discrete_obstacles: 0.8
        random_grid: 0.45
    fall:
      # A lying robot is the expensive simulation state and the source of
      # every heightfield contact overflow; it carries no locomotion signal.
      # The check is analytic (height lookup), so the chessboard gaps in the
      # base collider cannot be rested on undetected.
      on_base_contact: true
    sim:
      # Floor from the robot's collision set: 29 geoms that can pair with
      # the heightfield (20 leg geoms + the 9-cell base chessboard), 4
      # contacts each. A measured walking scan peaked at 12 contacts/env
      # against the previous 88 pool with nothing tripped.
      naconmax_per_env: 116
      # Clean scans measured nefc peaks of 647-681 in pile-up states; rows
      # past the cap apply no force with no warning. 1024 leaves headroom
      # and the terrain wrapper logs the live peak (warning at 90%).
      njmax: 1024

dr:
  motor_strength: { enable: true, range: [0.5, 1.1] }
  joint_gains: { enable: true, gain_pct: 0.2, kd_pct: 0.2 }
  # Per-foot-geom multiplier, and the feet take contact priority, so this
  # draw is the contact friction the policy actually walks on.
  foot_friction: { enable: true, range: [0.4, 1.35] }

ppo:
  log_training_metrics: true
  # Env-step budget of the DAgger loop (not a PPO run). The 100M
  # checkpoint cadence makes shorter-budget verdicts free.
  num_timesteps: 1000000000
  num_envs: 8192

run_name: wojtek_terrain_distill
