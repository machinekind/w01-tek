name: joystick

env:
  # Observations, in order. state = actor (real sensors), privileged =
  # critic (sim-only extras allowed). Catalog: gyro, gravity, joint_pos,
  # joint_vel, last_act, linvel, base_height, actuator_force, foot_contact,
  # command, phase.
  obs:
    state:
      - gyro
      - gravity
      - joint_pos
      - joint_vel
      - last_act
      - command
      - phase
    privileged:
      - gyro
      - gravity
      - joint_pos
      - joint_vel
      - last_act
      - command
      - phase
      - linvel
      - foot_contact

  # Randomized control latency at substep granularity. Off by default:
  # action_delay (see env.py default_config) drives a static
  # ctrl_delay=n_substeps, i.e. today's fixed one-control-step latency.
  # Enable to sample d ~ U[min_substeps, max_substeps] per env at reset;
  # d=0 = no delay, d=n_substeps(=5 at ctrl_dt=0.02/sim_dt=0.004) = today.
  # Under the brax training auto-reset wrapper, auto-reset restores a cached
  # state without re-running reset, so d is fixed per env for the whole
  # training run, not resampled per episode.
  latency:
    enable: false
    min_substeps: 0
    max_substeps: 5

  # Per-joint encoder-zero offset in rad, added to the observed joint angle
  # and subtracted from the written targets. Off by default.
  encoder:
    enable: false
    range: 0.02

  # Terrain curriculum, off by default. Enabling loads the generated terrain
  # scene, spawns each env on a curriculum tile, measures heights against the
  # local terrain surface, and trains under the terrain auto-reset wrapper.
  # Run `./training/run.sh build-terrain` first. The flat path is
  # byte-identical when enable=false. See docs/configuration.md.
  terrain:
    enable: false
    feet_only: true # only the 4 foot spheres and the base box collide with terrain
    spawn_yaw: true # random base yaw at every spawn
    pad_jitter: 0.15 # xy spawn jitter half-width, m; <= 0.2 keeps the settle on the pad
    init_level_frac: 0.5 # initial level drawn uniform over the lower this-fraction of rows
    demote_fraction: 0.5 # demote if walked < this * commanded planar distance

ppo: {}
